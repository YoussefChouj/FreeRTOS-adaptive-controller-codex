<!-- Adapted from amosblomqvist/learnharness (AGPL-3.0) - prompts/prober/10-probe-doctrine.md -->
<div class="lh-card" id="lh-probe-card" data-session="{{SESSION_ID}}" data-step="{{STEP_ID}}" data-kind="probe">
  <style>
    .lh-card {
      background: transparent;
      color: var(--text-primary, #e6edf3);
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      padding: 4px 0;
    }
    .lh-box {
      background: var(--bg-card, #1e222a);
      border: 1px solid var(--border-color, #333a47);
      border-left: 4px solid var(--accent-probe, #f59e0b);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .lh-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .lh-badge {
      background: rgba(245, 158, 11, 0.16);
      color: var(--accent-probe, #f59e0b);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .lh-context {
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 6px;
    }
    .lh-question {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    .lh-opts {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }
    .lh-opt {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: var(--bg-input, #14171d);
      border: 1px solid var(--border-color, #333a47);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .lh-field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 4px;
    }
    .lh-field textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-input, #14171d);
      color: var(--text-primary, #e6edf3);
      border: 1px solid var(--border-color, #333a47);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 46px;
    }
    .lh-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color, #333a47);
    }
    .lh-conf {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .lh-btn {
      background: var(--accent-probe, #f59e0b);
      color: #1c1302;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <div class="lh-box">
    <div class="lh-header">
      <span class="lh-badge">Diagnostic Probe</span>
      <span>Session {{SESSION_ID}} &middot; Step {{STEP_ID}}</span>
    </div>
    <div class="lh-context">{{CONTEXT}}</div>
    <div class="lh-question">{{QUESTION}}</div>
    <div class="lh-opts">
      <label class="lh-opt"><input type="radio" name="lh-probe-choice" value="A" checked /> <span><strong>A.</strong> {{OPT_A}}</span></label>
      <label class="lh-opt"><input type="radio" name="lh-probe-choice" value="B" /> <span><strong>B.</strong> {{OPT_B}}</span></label>
      <label class="lh-opt"><input type="radio" name="lh-probe-choice" value="C" /> <span><strong>C.</strong> {{OPT_C}}</span></label>
      <label class="lh-opt"><input type="radio" name="lh-probe-choice" value="D" /> <span><strong>D.</strong> {{OPT_D}}</span></label>
      <label class="lh-opt"><input type="radio" name="lh-probe-choice" value="pass" /> <span><strong>Unsure / Pass</strong> (Don't guess — mark clean boundary)</span></label>
    </div>
    <div class="lh-field">
      <label for="lh-probe-think1">{{THINK1_LABEL}} (Optional reasoning / why you ruled options in or out)</label>
      <textarea id="lh-probe-think1" placeholder="How are you reasoning about this question?"></textarea>
    </div>
    <div class="lh-footer">
      <div class="lh-conf">
        <label for="lh-probe-conf">Confidence:</label>
        <input type="range" id="lh-probe-conf" min="0" max="100" value="50" oninput="document.getElementById('lh-probe-conf-val').textContent=this.value+'%'" />
        <strong id="lh-probe-conf-val">50%</strong>
      </div>
      <button type="button" class="lh-btn" id="lh-probe-submit" onclick="window.lhSubmitProbe()">Submit Probe Answer</button>
    </div>
  </div>
  <script>
    window.lhSubmitProbe = function () {
      var root = document.getElementById('lh-probe-card');
      var session = root.getAttribute('data-session') || 's0';
      var step = root.getAttribute('data-step') || '1';
      var conf = document.getElementById('lh-probe-conf').value;
      var radios = root.querySelectorAll('input[name="lh-probe-choice"]');
      var choice = 'pass';
      for (var i = 0; i < radios.length; i++) {
        if (radios[i].checked) { choice = radios[i].value; break; }
      }
      var think1 = document.getElementById('lh-probe-think1').value.trim().replace(/\r?\n+/g, ' ');
      var lines = ['[learn] session=' + session + ' step=' + step + ' kind=probe confidence=' + conf + ' choice=' + choice];
      if (think1) lines.push('think1: ' + think1);
      lines.push('q1: ' + choice);
      var payload = lines.join('\n');
      if (typeof window.sendPrompt === 'function') window.sendPrompt(payload);
      return payload;
    };
  </script>
</div>
