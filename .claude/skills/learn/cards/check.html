<!-- Adapted from amosblomqvist/learnharness (AGPL-3.0) - prompts/teacher/30-question-principles.md -->
<div class="lh-card" id="lh-check-card" data-session="{{SESSION_ID}}" data-step="{{STEP_ID}}" data-kind="check">
  <style>
    .lh-card {
      background: transparent;
      color: var(--text-primary, #e6edf3);
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      padding: 4px 0;
    }
    .lh-box {
      background: var(--bg-card, #1e222a);
      border: 1px solid var(--border-color, #333a47);
      border-left: 4px solid var(--accent-check, #34d399);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .lh-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .lh-badge {
      background: rgba(52, 211, 153, 0.16);
      color: var(--accent-check, #34d399);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .lh-context {
      font-size: 13px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 10px;
    }
    .lh-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .lh-field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 3px;
    }
    .lh-q-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary, #e6edf3);
      margin-bottom: 4px;
    }
    .lh-field textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-input, #14171d);
      color: var(--text-primary, #e6edf3);
      border: 1px solid var(--border-color, #333a47);
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 44px;
    }
    .lh-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color, #333a47);
    }
    .lh-conf {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .lh-btn {
      background: var(--accent-check, #34d399);
      color: #06281e;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <div class="lh-box">
    <div class="lh-header">
      <span class="lh-badge">Check Understanding</span>
      <span>Session {{SESSION_ID}} &middot; Step {{STEP_ID}}</span>
    </div>
    <div class="lh-context">{{CONTEXT}}</div>
    <div class="lh-grid">
      <div class="lh-field">
        <label for="lh-check-think1">Thinking 1: {{THINK1_LABEL}}</label>
        <textarea id="lh-check-think1" placeholder="Core physical/mathematical setup..."></textarea>
      </div>
      <div class="lh-field">
        <label for="lh-check-think2">Thinking 2: {{THINK2_LABEL}}</label>
        <textarea id="lh-check-think2" placeholder="Step-by-step derivation or cause-effect chain..."></textarea>
      </div>
      <div class="lh-field">
        <label for="lh-check-think3">Thinking 3: {{THINK3_LABEL}}</label>
        <textarea id="lh-check-think3" placeholder="Sanity check / units / limiting case..."></textarea>
      </div>
      <div class="lh-field">
        <div class="lh-q-title">Question 1 (q1): {{Q1}}</div>
        <textarea id="lh-check-q1" placeholder="Answer to Question 1 (include number + unit where applicable)..."></textarea>
      </div>
      <div class="lh-field">
        <div class="lh-q-title">Question 2 (q2): {{Q2}}</div>
        <textarea id="lh-check-q2" placeholder="Answer to Question 2..."></textarea>
      </div>
    </div>
    <div class="lh-footer">
      <div class="lh-conf">
        <label for="lh-check-conf">Confidence:</label>
        <input type="range" id="lh-check-conf" min="0" max="100" value="50" oninput="document.getElementById('lh-check-conf-val').textContent=this.value+'%'" />
        <strong id="lh-check-conf-val">50%</strong>
      </div>
      <button type="button" class="lh-btn" id="lh-check-submit" onclick="window.lhSubmitCheck()">Submit Check</button>
    </div>
  </div>
  <script>
    window.lhSubmitCheck = function () {
      var root = document.getElementById('lh-check-card');
      var session = root.getAttribute('data-session') || 's0';
      var step = root.getAttribute('data-step') || '1';
      var conf = document.getElementById('lh-check-conf').value;
      var fields = ['think1', 'think2', 'think3', 'q1', 'q2'];
      var lines = ['[learn] session=' + session + ' step=' + step + ' kind=check confidence=' + conf];
      for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById('lh-check-' + fields[i]);
        var val = el ? el.value.trim().replace(/\r?\n+/g, ' ') : '';
        if (val) lines.push(fields[i] + ': ' + val);
      }
      var payload = lines.join('\n');
      if (typeof window.sendPrompt === 'function') window.sendPrompt(payload);
      return payload;
    };
  </script>
</div>
