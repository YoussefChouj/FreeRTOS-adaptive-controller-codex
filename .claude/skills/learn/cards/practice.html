<!-- Adapted from amosblomqvist/learnharness (AGPL-3.0) - prompts/practice/10-doctrine.md -->
<div class="lh-card" id="lh-practice-card" data-session="{{SESSION_ID}}" data-step="{{STEP_ID}}" data-kind="practice" data-hints="0">
  <style>
    .lh-card { background: transparent; color: var(--text-primary, #e6edf3); font-family: var(--font-sans, system-ui, sans-serif); padding: 4px 0; }
    .lh-box { background: var(--bg-card, #1e222a); border: 1px solid var(--border-color, #333a47); border-left: 4px solid var(--accent-practice, #a855f7); border-radius: 8px; padding: 14px 16px; }
    .lh-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted, #9ba3b0); margin-bottom: 8px; }
    .lh-badge { background: rgba(168, 85, 247, 0.18); color: var(--accent-practice, #c084fc); padding: 2px 8px; border-radius: 999px; font-weight: 600; text-transform: uppercase; }
    .lh-meta { font-size: 11px; background: var(--bg-input, #14171d); border: 1px solid var(--border-color, #333a47); padding: 2px 7px; border-radius: 4px; }
    .lh-question { font-size: 15px; font-weight: 600; line-height: 1.45; margin-bottom: 10px; }
    .lh-field { margin-bottom: 8px; }
    .lh-field label { display: block; font-size: 12px; color: var(--text-muted, #9ba3b0); margin-bottom: 3px; }
    .lh-field textarea { width: 100%; box-sizing: border-box; background: var(--bg-input, #14171d); color: var(--text-primary, #e6edf3); border: 1px solid var(--border-color, #333a47); border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit; resize: vertical; min-height: 44px; }
    .lh-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border-color, #333a47); }
    .lh-conf { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .lh-actions { display: flex; gap: 8px; align-items: center; }
    .lh-btn-sec { background: var(--bg-input, #14171d); color: var(--text-primary, #e6edf3); border: 1px solid var(--border-color, #333a47); border-radius: 6px; padding: 6px 11px; font-size: 12px; cursor: pointer; }
    .lh-btn { background: var(--accent-practice, #a855f7); color: #ffffff; border: none; border-radius: 6px; padding: 7px 15px; font-size: 13px; font-weight: 600; cursor: pointer; }
  </style>
  <div class="lh-box">
    <div class="lh-header">
      <span class="lh-badge">Adaptive Practice</span>
      <span>Nodes: <span class="lh-meta">{{NODE_TAGS}}</span> &middot; Diff: <span class="lh-meta">{{DIFFICULTY}}</span> &middot; {{SESSION_ID}}/{{STEP_ID}}</span>
    </div>
    <div class="lh-question">{{QUESTION}}</div>
    <div class="lh-field">
      <label for="lh-practice-think1">Chunk 1 ({{THINK1_LABEL}} — Cues / recalled propositions)</label>
      <textarea id="lh-practice-think1" placeholder="What cues stand out and which relation comes to mind?"></textarea>
    </div>
    <div class="lh-field">
      <label for="lh-practice-think2">Chunk 2 ({{THINK2_LABEL}} — Derivation / setup)</label>
      <textarea id="lh-practice-think2" placeholder="Work through the algebra or physical balance..."></textarea>
    </div>
    <div class="lh-field">
      <label for="lh-practice-think3">Chunk 3 ({{THINK3_LABEL}} — Verification / units)</label>
      <textarea id="lh-practice-think3" placeholder="Check units and boundary limits..."></textarea>
    </div>
    <div class="lh-field">
      <label for="lh-practice-q1">Final Solution (q1)</label>
      <textarea id="lh-practice-q1" placeholder="Final numerical or analytical answer..."></textarea>
    </div>
    <div class="lh-footer">
      <div class="lh-conf">
        <label for="lh-practice-conf">Confidence:</label>
        <input type="range" id="lh-practice-conf" min="0" max="100" value="50" oninput="document.getElementById('lh-practice-conf-val').textContent=this.value+'%'" />
        <strong id="lh-practice-conf-val">50%</strong>
      </div>
      <div class="lh-actions">
        <button type="button" class="lh-btn-sec" id="lh-practice-chunk" onclick="window.lhSubmitPractice('chunk')">Send Thinking Chunk</button>
        <button type="button" class="lh-btn-sec" id="lh-practice-hint" onclick="window.lhSubmitPractice('hint')">Hint (<span id="lh-practice-hint-cnt">0</span>)</button>
        <button type="button" class="lh-btn" id="lh-practice-submit" onclick="window.lhSubmitPractice('practice')">Submit</button>
      </div>
    </div>
  </div>
  <script>
    window.lhSubmitPractice = function (mode) {
      var root = document.getElementById('lh-practice-card');
      var session = root.getAttribute('data-session') || 's0';
      var step = root.getAttribute('data-step') || '1';
      var hints = parseInt(root.getAttribute('data-hints') || '0', 10);
      if (mode === 'hint') {
        hints += 1;
        root.setAttribute('data-hints', String(hints));
        document.getElementById('lh-practice-hint-cnt').textContent = String(hints);
      }
      var conf = document.getElementById('lh-practice-conf').value;
      var kind = mode === 'hint' ? 'hint' : 'practice';
      var lines = ['[learn] session=' + session + ' step=' + step + ' kind=' + kind + ' confidence=' + conf + ' hints=' + hints];
      var fields = ['think1', 'think2', 'think3', 'q1'];
      for (var i = 0; i < fields.length; i++) {
        var el = document.getElementById('lh-practice-' + fields[i]);
        var val = el ? el.value.trim().replace(/\r?\n+/g, ' ') : '';
        if (val) lines.push(fields[i] + ': ' + val);
      }
      var payload = lines.join('\n');
      if (typeof window.sendPrompt === 'function') window.sendPrompt(payload);
      return payload;
    };
  </script>
</div>
