<!-- Adapted from amosblomqvist/learnharness (AGPL-3.0) - components/reading-thinking.tsx & prompts/shared/16-mental-model.md -->
<div class="lh-card" id="lh-reading-card" data-session="{{SESSION_ID}}" data-step="{{STEP_ID}}" data-kind="reading">
  <style>
    .lh-card {
      background: transparent;
      color: var(--text-primary, #e6edf3);
      font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
      padding: 4px 0;
    }
    .lh-box {
      background: var(--bg-card, #1e222a);
      border: 1px solid var(--border-color, #333a47);
      border-left: 4px solid var(--accent-reading, #38bdf8);
      border-radius: 8px;
      padding: 14px 16px;
    }
    .lh-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .lh-badge {
      background: rgba(56, 189, 248, 0.16);
      color: var(--accent-reading, #38bdf8);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .lh-context {
      font-size: 13px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 8px;
      line-height: 1.45;
    }
    .lh-question {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .lh-field {
      margin-bottom: 10px;
    }
    .lh-field label {
      display: block;
      font-size: 12px;
      color: var(--text-muted, #9ba3b0);
      margin-bottom: 4px;
    }
    .lh-field textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-input, #14171d);
      color: var(--text-primary, #e6edf3);
      border: 1px solid var(--border-color, #333a47);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 52px;
    }
    .lh-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-color, #333a47);
    }
    .lh-conf {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .lh-btn {
      background: var(--accent-reading, #38bdf8);
      color: #0f172a;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <div class="lh-box">
    <div class="lh-header">
      <span class="lh-badge">Thinking While Reading</span>
      <span>Session {{SESSION_ID}} &middot; Step {{STEP_ID}}</span>
    </div>
    <div class="lh-context">{{CONTEXT}}</div>
    <div class="lh-question">{{QUESTION}}</div>
    <div class="lh-field">
      <label for="lh-reading-think1">{{THINK1_LABEL}} (What clicked / core mechanism in your own words)</label>
      <textarea id="lh-reading-think1" placeholder="Jot down what makes sense or how you picture this step..."></textarea>
    </div>
    <div class="lh-field">
      <label for="lh-reading-think2">{{THINK2_LABEL}} (Open question / edge case / doubt while reading)</label>
      <textarea id="lh-reading-think2" placeholder="Any part that feels fuzzy, unmotivated, or needs a check..."></textarea>
    </div>
    <div class="lh-footer">
      <div class="lh-conf">
        <label for="lh-reading-conf">Confidence:</label>
        <input type="range" id="lh-reading-conf" min="0" max="100" value="50" oninput="document.getElementById('lh-reading-conf-val').textContent=this.value+'%'" />
        <strong id="lh-reading-conf-val">50%</strong>
      </div>
      <button type="button" class="lh-btn" id="lh-reading-submit" onclick="window.lhSubmitReading()">Submit Reading Notes</button>
    </div>
  </div>
  <script>
    window.lhSubmitReading = function () {
      var root = document.getElementById('lh-reading-card');
      var session = root.getAttribute('data-session') || 's0';
      var step = root.getAttribute('data-step') || '1';
      var conf = document.getElementById('lh-reading-conf').value;
      var think1 = document.getElementById('lh-reading-think1').value.trim().replace(/\r?\n+/g, ' ');
      var think2 = document.getElementById('lh-reading-think2').value.trim().replace(/\r?\n+/g, ' ');
      var lines = ['[learn] session=' + session + ' step=' + step + ' kind=reading confidence=' + conf];
      if (think1) lines.push('think1: ' + think1);
      if (think2) lines.push('think2: ' + think2);
      var payload = lines.join('\n');
      if (typeof window.sendPrompt === 'function') window.sendPrompt(payload);
      return payload;
    };
  </script>
</div>
