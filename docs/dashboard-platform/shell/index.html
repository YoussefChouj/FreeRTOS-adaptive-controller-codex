<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAV Ground Station</title>
  <!-- Discovery for arriving agents. The manifest says which controls on this
       page may be operated without a human and warns that the page commands a
       powered-on aircraft; llms.txt points at the four documents worth reading
       first. Both are generated server-side from the live action registry, so
       they cannot drift from what the service enforces. -->
  <link rel="agent-permissions" href="/.well-known/agent-permissions.json" />
  <link rel="llms-txt" type="text/markdown" href="/llms.txt" />
  <link rel="icon" href="data:,">
  <!-- WP-35 design system: tokens (colour, spacing, type, radius; dark + light theme) in one file, shared
       components, and window.GSUI (ui-kit.js) loaded before any plugin. See ../ux-guide.md. -->
  <link rel="stylesheet" href="/ui/tokens.css" />
  <link rel="stylesheet" href="/ui/components.css" />
  <script src="/ui/ui-kit.js"></script>
  <!-- WP-39: the one alarm registry (levels, required actions, debounce, voice), shared by the sidebar and Overview -->
  <script src="/ui/alarms.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    /* Lives at the top of #sidebar: stacked, wrapping, no full-width bar. */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 0 10px;
      margin-bottom: 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-badge.connected {
      background: var(--gs-ok-bg);
      color: var(--green);
    }
    .status-badge.connected::before { background: var(--green); }

    .status-badge.disconnected {
      background: var(--gs-stale-bg);
      color: var(--muted);
    }
    .status-badge.disconnected::before { background: var(--muted); }

    .status-badge.error {
      background: var(--gs-fail-bg);
      color: var(--red);
    }
    .status-badge.error::before { background: var(--red); }

    /* ── Record control ── */
    #record-control {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      font-size: 12px;
      color: var(--text);
    }
    #record-control #note-input { flex: 1 1 90px; min-width: 0; }
    #record-control .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
    }
    #record-control .rec-dot.on {
      background: var(--red);
      box-shadow: 0 0 6px var(--red);
      animation: recpulse 1.2s infinite;
    }
    @keyframes recpulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    #record-control button {
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--muted);
      border-radius: 5px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #record-control button:hover:not(:disabled) { border-color: var(--green); }
    #record-control button:disabled { opacity: 0.5; cursor: default; }
    #record-control button.stop { border-color: var(--red); color: var(--red); }
    #record-control input, #record-control select {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--muted);
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 12px;
    }
    #record-control #rec-meta {
      color: var(--muted);
      font-size: 11px;
    }

    /* ── Workspace tab bar ── */
    #workspace-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }

    .ws-tab {
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ws-tab:hover { border-color: var(--border); color: var(--text); }
    .ws-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--text);
    }

    /* Pending-approvals count badge on the Approvals tab */
    .approval-badge {
      display: inline-block; margin-left: 6px; padding: 0 6px;
      border-radius: 8px; background: var(--gs-fail);
      color: var(--gs-text-on-status); font-size: 10px; font-weight: 700; line-height: 15px;
    }

    /* ── Gate indicator bar ── */
    #gate-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 0 0 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .gate-item {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    .gate-item.pass { color: var(--gs-ok); border-color: var(--gs-ok-bg); }
    .gate-item.fail { color: var(--gs-fail); border-color: var(--gs-fail-bg); }
    .gate-item.unknown { color: var(--gs-stale); border-color: var(--gs-stale-bg); }
    .gate-item::before { content: ''; width: 6px; height: 6px; border-radius: 50%; }
    .gate-item.pass::before { background: var(--green); }
    .gate-item.fail::before { background: var(--red); }
    .gate-item.unknown::before { background: var(--muted); }

    /* Plugin workspace visibility is driven by switchWorkspace() (inline display). */

    /* ── Signal freshness badge ── */
    .signal-live { color: var(--green); }
    .signal-stale { color: var(--amber); }
    .signal-degraded { color: var(--amber); }
    .signal-unknown { color: var(--muted); }
    .signal-unverified { color: var(--red); }
    .signal-replay { color: var(--gs-info); }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: minmax(0, 1fr);
      flex: 1 1 auto;
      min-height: 0;
    }

    /* Sidebar collapse (item 1). Collapsing drops the first grid column to 0
     * so #main + the workspace/gate bars (column 2) take the full freed width;
     * a fixed re-open button appears when the sidebar is hidden. */
    #app.sidebar-hidden { grid-template-columns: 0 1fr; }
    #app.sidebar-hidden #sidebar { display: none; }
    #sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    #sidebar-reopen {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-size: 12px; padding: 4px 10px; border-radius: 4px;
      cursor: pointer; margin-right: 6px;
    }
    #sidebar-reopen:hover { border-color: var(--accent); }

    #sidebar {
      grid-row: 1 / -1;
      background: var(--card);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
    }

    #main {
      grid-column: 2;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
      flex-direction: column;
      gap: 16px;
    }

    /* ── Cards & Panels ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .toggle-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .toggle-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── State overview ── */
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--muted);
    }

    .stat-value {
      font-size: 15px;
      font-weight: 600;
      font-family: 'Consolas', monospace;
    }

    /* ── Alarms (rows from ui/alarms.js: level, condition, required action, Silence) ── */
    .alarm-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .alarm-item {
      display: flex;
      flex-direction: column;
      gap: var(--gs-space-1);
      padding: 6px 10px;
      border-radius: var(--gs-radius-sm);
      font-size: 12px;
      font-weight: 600;
    }
    .alarm-item--caution { background: var(--gs-warn-bg); color: var(--gs-warn); }
    .alarm-item--warning { background: var(--gs-fail-bg); color: var(--gs-fail); }
    .alarm-item.is-silenced { opacity: 0.6; }
    .alarm-item .alarm-head { display: flex; align-items: center; gap: var(--gs-space-2); }
    .alarm-item .alarm-action { color: var(--gs-text); font-weight: 400; }
    .alarm-item .alarm-silence { margin-left: auto; padding: 0 var(--gs-space-2); font-size: var(--gs-text-sm); }

    /* ── Panel groups: one card, one tab per panel (PANEL_GROUPS) ── */
    .panel-group-tabs { margin: 0 0 var(--gs-space-2); }

    .no-alarms {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 8px;
    }

    /* ── Plugin panels ── */
    #plugin-panels {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 4px;
      border-top: 1px solid var(--border);
      flex: 0 0 auto;
    }
    #reload-banner {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
      display: flex; gap: var(--gs-space-3); align-items: center; justify-content: space-between;
      padding: var(--gs-space-3) var(--gs-space-4); font-size: var(--gs-text-md);
      background: var(--gs-surface); border-top: 1px solid var(--gs-ok); color: var(--gs-text);
    }
    #reload-banner.hidden { display: none !important; }
    /* Agent-mode strip is fixed at the bottom-centre of the viewport
       (header-mode-pill.js). On narrow/phone widths give the scrolled
       content bottom clearance so the strip never covers a panel's last row. */
    @media (max-width: 640px) {
      body { padding-bottom: 76px; }
      #main { padding-bottom: 76px; }
    }
  </style>
</head>
<body>

<!-- Flight-critical state, always visible (plugins/flight-strip.js fills it): ARM, mode, battery, RC, link age,
     campaign status, and Pause / Land / Abort. Outside #app so no workspace switch or sidebar collapse hides it. -->
<div id="flight-strip" role="region" aria-label="Flight state and campaign actions" data-testid="flight-strip"></div>

<div id="workspace-bar" role="tablist" aria-label="Workspace">
  <!-- Sidebar re-open control: visible only when the sidebar is collapsed. -->
  <button id="sidebar-reopen" style="display:none" title="Restore sidebar">&#187; Sidebar</button>
  <button class="ws-tab active" role="tab" aria-selected="true" data-ws="overview" data-testid="tab-overview">Overview</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="control" data-testid="tab-control">Control</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="estimator" data-testid="tab-estimator">Estimator</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="mrac" data-testid="tab-mrac">MRAC</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="telemetry" data-testid="tab-telemetry">Telemetry</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="experiments" data-testid="tab-experiments">Experiments</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="paths" data-testid="tab-paths">Paths</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="bench" data-testid="tab-bench">Bench</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="replay" data-testid="tab-replay">Replay</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="diagnostics" data-testid="tab-diagnostics">Diagnostics</button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="approvals" data-testid="tab-approvals">Approvals<span class="approval-badge" id="approval-badge" style="display:none"></span></button>
  <button class="ws-tab" role="tab" aria-selected="false" data-ws="terminal" data-testid="tab-terminal">Terminal</button>
</div>

<div id="app">
  <div id="sidebar">
    <!-- Shell header + gate bar live in the sidebar; only the tab row stays on top. -->
    <header>
      <h1>UAV Ground Station</h1>
      <div id="status" class="status-badge disconnected">Connecting…</div>
      <div id="record-control">
        <span class="rec-dot" id="rec-dot"></span>
        <button id="record-btn" disabled>● REC</button>
        <span id="rec-meta" title="">—</span>
        <select id="note-kind" title="note kind"><option>note</option><option>goal</option><option>marker</option></select>
        <input id="note-input" type="text" placeholder="add note…" />
        <button id="note-btn" disabled>Add</button>
      </div>
    </header>
    <div id="gate-bar" role="status" aria-live="polite" aria-label="Flight gates and alarms">
      <div class="gate-item unknown" id="gate-connection" title="MicoAir WiFi connected">
        <span class="gate-label">&#x1F4F6; CONN</span>
      </div>
      <div class="gate-item unknown" id="gate-disarmed" title="Drone disarmed">
        <span class="gate-label">&#x1F6B6; DISARM</span>
      </div>
      <div class="gate-item unknown" id="gate-fresh" title="Telemetry freshness">
        <span class="gate-label">&#x1F4CA; FRESH</span>
      </div>
      <div class="gate-item unknown" id="gate-schema" title="Telemetry schema known">
        <span class="gate-label">&#x1F4CC; SCHEMA</span>
      </div>
      <div class="gate-item unknown" id="gate-command" title="Command gateway available">
        <span class="gate-label">&#x1F4E1; CMD</span>
      </div>
    </div>
    <div id="sidebar-header">
      <span class="card-title" style="color:var(--muted)">Flight State</span>
      <button id="sidebar-collapse" class="toggle-btn" title="Collapse sidebar (free space for plots)">&larr; Hide</button>
    </div>
    <!-- sidebar: session + alarms. ARM, mode and battery live on the flight strip only (WP-39 removed the
         duplicate Flight Status card; the Control tab's Flight Status panel keeps the detail). -->
    <div class="card" id="card-state">
      <div class="card-header">
        <span class="card-title">Session</span>
        <button class="toggle-btn" data-panel="state">Hide</button>
      </div>
      <div class="stat-grid">
        <div class="stat-item">
          <span class="stat-label">Schema ID</span>
          <span class="stat-value" id="schema_id" style="font-size:11px">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Session</span>
          <span class="stat-value" id="session_id" data-testid="session-id" style="font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Samples</span>
          <span class="stat-value" id="samples">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Last Update</span>
          <span class="stat-value" id="last_update" style="font-size:11px">—</span>
        </div>
      </div>
    </div>

    <div class="card" id="card-alarms">
      <div class="card-header">
        <span class="card-title">Alarms</span>
        <button class="toggle-btn" data-panel="alarms">Hide</button>
      </div>
      <div class="alarm-list" id="alarm-list">
        <div class="no-alarms">No active alarms</div>
      </div>
    </div>
  </div>

  <div id="main">
    <!-- Every panel is a plugin card. WP-39 removed the two hand-written cards: Telemetry Streams (per-slot seq /
         loss / samples, the same numbers as the Bandwidth Manager panel) and the hidden raw Command form (the
         Command Panel on the Control tab replaces it). -->
    <div id="plugin-panels"></div>
  </div>
</div>

<footer>UAV Ground Station Shell &mdash; polls every 500 ms</footer>

<!-- Phase 1B: code-reload banner (shown when index.html or shared shell
     files change; preserves sessionStorage state across reload). -->
<div id="reload-banner" class="hidden">
  <div>
    <strong>What changed</strong> <span id="reload-files">—</span>
    <div id="reload-summary" class="gs-label"></div>
  </div>
  <div class="gs-row">
    <button id="reload-stay" class="gs-btn gs-btn--ghost">Stay</button>
    <button id="reload-now" class="gs-btn gs-btn--ok">Reload</button>
  </div>
</div>

<script>
(async function () {
  'use strict';

  /* ── API version (per plugin-api.md § "Versioning and stability") ──
   * Plugins read this constant to detect API-version mismatches. Set BEFORE
   * any plugin is eval'd so a plugin that checks at registration time sees
   * the right value. Earlier revisions documented this constant in
   * plugin-api.md but never set it on the shell, so the contract was
   * effectively a no-op: every plugin loaded against every shell version
   * with no diagnostic. Setting it here closes the gap so the documented
   * `if (window.__SHELL_API_VERSION__ !== 'v2')` check works. */
  window.__SHELL_API_VERSION__ = 'v2';

  /* One error path for the shell itself (WP-35): GSUI.report when ui/ui-kit.js is loaded, else the console.
   * Background failures (storage blocked, a bad SSE frame) are logged once per kind and never swallowed;
   * toast=true also tells the operator. */
  var _shellWarned = {};
  function shellWarn(where, e, toast) {
    if (window.GSUI) { window.GSUI.report(where, e, toast ? {} : { toast: false, once: where }); return; }
    if (_shellWarned[where]) return;
    _shellWarned[where] = true;
    console.warn('[shell] ' + where + ':', e);
  }

  /* ── Plugin registry with workspace metadata ── */
  /* Each plugin calls __registerPlugin__(name, init, destroy) OR
   * __registerPlugin__(name, init, destroy, meta) where meta is:
   *   { workspace: string,    // primary workspace name e.g. 'control', 'mrac'
   *     gates: string[],     // required safety gates e.g. ['disarmed', 'connected']
   *     description: string } // human-readable description
   * Plugins that pass only 3 args default to workspace='all' with no gates. */
  window.__gs_plugins__ = [];
  window.__registerPlugin__ = function (name, init, destroy, meta) {
    meta = meta || {};
    window.__gs_plugins__.push({
      name: name,
      init: init,
      destroy: destroy || function () {},
      workspace: meta.workspace || 'overview',
      gates: meta.gates || [],
      description: meta.description || '',
    });
  };

  /* ── Load all plugins (they call window.__registerPlugin__ on eval) ── */
  const PLUGIN_FILES = [
    '/plugins/flight-strip.js',    // WP-35: flight-critical strip + Pause/Land/Abort on every workspace (first)
    '/plugins/overview-panel.js',  // 20260921-044235: PLC-style HMI overview — first/default tab
    '/plugins/status-panel.js',
    '/plugins/mrac-panel.js',
    '/plugins/estimator-panel.js',
    '/plugins/resource-panel.js',
    '/plugins/safety-panel.js',
    '/plugins/telemetry-explorer-panel.js',
    '/plugins/command-panel.js',
    '/plugins/experiment-panel.js',
    '/plugins/campaign-panel.js',
    '/plugins/motor-bench-panel.js',
    '/plugins/time-series-panel.js',
    '/plugins/fft-panel.js',
    '/plugins/bandwidth-panel.js',
    '/plugins/replay-panel.js',
    '/plugins/path-panel.js',
    '/plugins/slot-manager-panel.js',
    '/plugins/streams-panel.js',       // Phase 3: slots 1-3 swap, restore, logging, VOFA+ forward
    '/plugins/resource-map-panel.js',  // S7: firmware resource/data-flow map
    '/plugins/pid-gains-panel.js',     // PID inner/outer gains with firmware defaults
    '/plugins/record-helper.js',       // recorder: saved log path, note-kind helper
    '/plugins/preset-picker.js',       // subscribe-preset dropdown (applies on select, disarmed only)
    '/plugins/flight-test-panel.js',    // T14b: flight-test pipeline UI (analyse, controller, payload, notes)
    '/plugins/dataflow-panel.js',      // sensor -> estimator -> control -> motors block diagram
    // Phase 1B: agent UI plugins
    '/plugins/copilot-drawer.js',       // A: co-pilot drawer
    '/plugins/header-mode-pill.js',     // B: header mode pill + big STOP
    '/plugins/approval-queue.js',       // C: ordered approval queue
    '/plugins/activity-timeline.js',    // D: activity timeline
    '/plugins/highlight-overlay.js',    // E: highlight overlay + ui executor
    '/plugins/code-reload-banner.js',   // F: per-plugin hot reload + banner
    '/plugins/terminal-panel.js',       // Terminal PTY session via WebSocket (xterm.js)
  ];

  for (const src of PLUGIN_FILES) {
    try {
      const res = await fetch(src);
      if (!res.ok) { console.warn('[shell] plugin not found:', src); continue; }
      const text = await res.text();
      eval(text);  // plugins call window.__registerPlugin__()
    } catch (e) {
      console.warn('[shell] failed to load plugin', src, e);
    }
  }

  /* ── State ── */
  let currentState = null;
  let _destroyFns = [];

  /* ── Layout persistence ── */
  var LAYOUT_KEY = 'gs_shell_layout';

  function loadLayout() {
    try {
      return JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}');
    } catch (e) { shellWarn('saved layout', e); return {}; }
  }

  function saveLayout() {
    var visible = {};
    document.querySelectorAll('[data-panel]').forEach(function (btn) {
      var panel = btn.getAttribute('data-panel');
      var card = document.getElementById('card-' + panel);
      if (card) visible[panel] = card.style.display !== 'none';
    });
    localStorage.setItem(LAYOUT_KEY, JSON.stringify(visible));
  }

  function applyLayout() {
    var saved = loadLayout();
    Object.keys(saved).forEach(function (panel) {
      var card = document.getElementById('card-' + panel);
      if (!card) return;
      card.style.display = saved[panel] ? '' : 'none';
      var btn = document.querySelector('[data-panel="' + panel + '"]');
      if (btn) btn.textContent = saved[panel] ? 'Hide' : 'Show';
    });
  }

  document.querySelectorAll('[data-panel]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var panel = btn.getAttribute('data-panel');
      var card = document.getElementById('card-' + panel);
      if (!card) return;
      var visible = card.style.display !== 'none';
      card.style.display = visible ? 'none' : '';
      btn.textContent = visible ? 'Show' : 'Hide';
      saveLayout();
    });
  });

  applyLayout();

  /* ── Sidebar collapse / re-open (item 1) ── */
  /* Collapsing the sidebar drops its grid column to 0 so the workspace bar,
   * gate bar and #main reflow to the full freed width. A fixed re-open button
   * stays available so the sidebar is never stuck hidden. */
  function setSidebarCollapsed(collapsed) {
    var app = document.getElementById('app');
    if (!app) return;
    app.classList.toggle('sidebar-hidden', !!collapsed);
    var sidebar = document.getElementById('sidebar');
    // Reopening must fully restore the sidebar even if a prior action left an
    // inline display:none on it (the collapse hides via the class, not by
    // clearing content): clearing inline display here guarantees the same
    // DOM subtree always round-trips back into view — nothing is re-parented
    // or dropped on the hide/show cycle.
    if (!collapsed && sidebar) sidebar.style.display = '';
    var rb = document.getElementById('sidebar-reopen');
    if (rb) rb.style.display = collapsed ? 'block' : 'none';
    try { localStorage.setItem('gs_sidebar_collapsed', collapsed ? '1' : '0'); } catch (e) { shellWarn('localStorage', e); }
    // Reflow canvas plots that listen for resize.
    try { window.dispatchEvent(new Event('resize')); } catch (e) { shellWarn('resize event', e); }
  }
  var cb = document.getElementById('sidebar-collapse');
  if (cb) cb.addEventListener('click', function () { setSidebarCollapsed(true); });
  var rb = document.getElementById('sidebar-reopen');
  if (rb) rb.addEventListener('click', function () { setSidebarCollapsed(false); });
  // Restore persisted collapse state.
  try {
    if (localStorage.getItem('gs_sidebar_collapsed') === '1') setSidebarCollapsed(true);
  } catch (e) { shellWarn('localStorage', e); }

  /* ── Workspace switching ── */
  /* State model per signal:
   *   live       — received fresh telemetry within TTL
   *   stale      — last received but older than TTL
   *   degraded   — received with loss > threshold
   *   unknown    — no data ever received on this slot
   *   unverified — received but not confirmed against ground truth
   *   replay     — data sourced from session replay (not live) */
  var _activeWorkspace = 'overview';
  var _lastArmState = null;   // cached for gate evaluation

  function getSignalState(slotData, nowNs, ttlNs) {
    // 'slotData' is state.streams[slot] or a {values, last_update_ns, loss_pct} dict
    if (!slotData) return 'unknown';
    var lastNs = slotData.last_update_ns || 0;
    if (!lastNs) return 'unknown';
    var age = nowNs - lastNs;
    if (age > ttlNs * 2) return 'stale';
    if (age > ttlNs) return 'stale';
    var loss = slotData.loss_pct || 0;
    if (loss > 5) return 'degraded';
    if (loss > 1) return 'degraded';
    // Check if any keys are actually fresh
    var keyTs = slotData._key_ts || {};
    var values = slotData.values || {};
    var freshCount = 0;
    var totalCount = 0;
    if (typeof values === 'object') {
      Object.keys(values).forEach(function (k) {
        totalCount++;
        var kt = keyTs[k];
        if (kt && (nowNs - kt) < ttlNs) freshCount++;
      });
    }
    if (totalCount === 0) return 'unknown';
    if (freshCount === 0) return 'stale';
    return 'live';
  }

  /* Safety gates: evaluated on every poll.
   * Gates block plugin-initiated commands and parameter writes until they pass.
   * read-only plugins (overview, telemetry) do not require gates. */
  var _gates = {
    connected: false,   // MicoAir WiFi is reachable (health responded)
    disarmed: false,   // drone ARM state = 0 (safe to send parameter commands)
    fresh: false,      // at least one slot received telemetry in last TTL
    schema: false,     // telemetry_schema_id is known (schema 0x08 reply received)
    command: false,    // command gateway is available
  };

  function evaluateGates(state) {
    var nowNs = Date.now() * 1e6;
    var ttlNs = (state && state.slot_freshness_ttl_ns) || 30e9;

    // Connection gate: bridge is available and state says connected
    var connectedGate = !!(state && (state.connected || state.streams && Object.keys(state.streams).length > 0));
    _gates.connected = connectedGate;

    // ARM gate: fails closed -- disarmed only when status.arm was seen and is 0
    var armSeen = false, anyArmed = false;
    if (state && state.streams) {
      Object.keys(state.streams).forEach(function (slot) {
        var s = state.streams[slot];
        if (s && s.values) {
          var arm = s.values['status.arm'];
          // A frozen arm=0 (FC rebooted, slots lost) proves nothing: skip it.
          var armTs = (s._key_ts || {})['status.arm'];
          if (armTs && nowNs - armTs > ttlNs) arm = null;
          if (arm != null) { armSeen = true; if (arm !== 0) anyArmed = true; }
        }
      });
    }
    _gates.disarmed = armSeen && !anyArmed;
    _lastArmState = !armSeen ? null : (anyArmed ? 'armed' : 'disarmed');

    // Freshness gate: at least one slot received telemetry within TTL
    var fresh = false;
    if (state && state.streams) {
      Object.keys(state.streams).forEach(function (slot) {
        var s = state.streams[slot];
        if (!s) return;
        var lastNs = s.last_update_ns || 0;
        if (lastNs && (nowNs - lastNs) < ttlNs) fresh = true;
      });
    }
    _gates.fresh = fresh;

    // Schema gate: telemetry_schema_id is known
    _gates.schema = !!(state && state.telemetry_schema_id);

    // Command gate: gateway is available
    _gates.command = !!(state && state.connected);
  }

  function renderGates() {
    var gateMap = {
      'gate-connection': _gates.connected,
      'gate-disarmed': _gates.disarmed,
      'gate-fresh': _gates.fresh,
      'gate-schema': _gates.schema,
      'gate-command': _gates.command,
    };
    Object.keys(gateMap).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var pass = gateMap[id];
      el.className = 'gate-item ' + (pass ? 'pass' : 'fail');
    });
  }

  /* Gate-aware command wrapper: checks all gates before issuing a command.
   * Returns a rejected Promise if any required gate fails.
   * Plugins that need specific gates pass them as a string array.
   * Plugins with no gates array can issue commands without gate checks (dangerous!). */
  function gatedCommand(cmdId, index, value, requiredGates) {
    requiredGates = requiredGates || [];
    var failed = [];
    requiredGates.forEach(function (g) {
      if (_gates[g] === false) failed.push(g);
    });
    if (failed.length > 0) {
      return Promise.reject(new Error('Gate(s) not satisfied: ' + failed.join(', ') + '. ARM=' + _lastArmState));
    }
    return shellApi.submitCommand(cmdId, index, value);
  }

  /* Default workspace(s) and gates per panel name. A plugin's own meta wins. */
  var PANEL_META = {
    // One home tab per panel: a panel shown on two tabs reads as two sources.
    'Flight Status':         { workspace: 'control' },
    'PID Gains':             { workspace: 'control' },
    'What changed':          { workspace: 'diagnostics' },
    'Safety Limits':         { workspace: 'control' },
    'Command Panel':         { workspace: 'control', gates: ['connected', 'disarmed'] },
    'Time Series':           { workspace: 'telemetry' },
    'MRAC Controller':       { workspace: 'mrac' },
    'EKF Estimator':         { workspace: 'estimator' },
    'Telemetry Explorer':    { workspace: 'telemetry' },
    'Slot Manager':          { workspace: 'telemetry' },
    'Streams':               { workspace: 'telemetry' },
    'Bandwidth Manager':     { workspace: 'telemetry' },
    'FFT Spectrum':          { workspace: 'telemetry' },
    'Experiment Runtime':    { workspace: 'experiments' },
    'Campaign':              { workspace: 'experiments' },
    'Path Planning':         { workspace: 'paths' },
    'Motor Bench':           { workspace: 'bench', gates: ['connected', 'disarmed'] },
    'Session Replay':        { workspace: 'replay' },
    'RTOS Resources':        { workspace: 'diagnostics' },
    'Firmware Resource Map': { workspace: 'diagnostics' },
    'Approvals':             { workspace: 'approvals' },
    'Terminal':              { workspace: 'terminal' }
  };

  /* Panels that share a group are tabs of one card (WP-39): Streams, Bandwidth Manager and Slot Manager were three
   * cards with overlapping slot tables and three subscribe paths. Each tab keeps one job and its own ids / testid. */
  var PANEL_GROUPS = {
    'Streams':           { group: 'Telemetry Slots', tab: 'What slots carry' },
    'Bandwidth Manager': { group: 'Telemetry Slots', tab: 'Link health' },
    'Slot Manager':      { group: 'Telemetry Slots', tab: 'Expert subscribe' }
  };

  function slugOf(name) { return name.replace(/\s+/g, '-').toLowerCase(); }

  // the group card (a .plugin-card, so workspace switching shows / hides it) with a tab row; created once
  function groupCard(groupName, ws) {
    var gslug = slugOf(groupName);
    var card = document.getElementById('plugin-' + gslug);
    if (card) return card;
    card = document.createElement('div');
    card.className = 'card plugin-card';
    card.id = 'plugin-' + gslug;
    card.setAttribute('data-workspaces', ws);
    card.setAttribute('data-testid', 'panel-' + gslug);
    card.setAttribute('role', 'region');
    card.setAttribute('aria-label', groupName);
    if (!wsMatches(ws, _activeWorkspace)) card.style.display = 'none';
    var header = document.createElement('div');
    header.className = 'card-header';
    var title = document.createElement('span');
    title.className = 'card-title';
    title.textContent = groupName;
    header.appendChild(title);
    var tabs = document.createElement('div');
    tabs.className = 'gs-row panel-group-tabs';
    tabs.id = 'plugin-tabs-' + gslug;
    tabs.setAttribute('role', 'tablist');
    card.appendChild(header);
    card.appendChild(tabs);
    document.getElementById('plugin-panels').appendChild(card);
    return card;
  }

  // shows one tab of a group; save = the operator clicked it (registration only shows, never overwrites the choice)
  function showGroupTab(groupName, slug, save) {
    var gslug = slugOf(groupName);
    Object.keys(PANEL_GROUPS).forEach(function (n) {
      if (PANEL_GROUPS[n].group !== groupName) return;
      var s = slugOf(n), on = s === slug;
      var sub = document.getElementById('plugin-' + s);
      var btn = document.getElementById('plugin-tab-' + s);
      if (sub) sub.style.display = on ? '' : 'none';
      if (btn) { btn.className = 'gs-btn' + (on ? ' is-active' : ''); btn.setAttribute('aria-selected', on ? 'true' : 'false'); }
    });
    if (!save) return;
    try { localStorage.setItem('gs_group_tab_' + gslug, slug); } catch (e) { shellWarn('localStorage', e); }
  }

  /* data-workspaces is a space-separated token list; 'all' matches every tab. */
  function wsMatches(wsAttr, name) {
    var toks = String(wsAttr || '').split(/[\s,]+/);
    return toks.indexOf(name) >= 0 || toks.indexOf('all') >= 0;
  }

  function switchWorkspace(name) {
    _activeWorkspace = name;
    // Update tab active state. aria-selected carries the same fact as the
    // .active class, but into the accessibility tree, which is what an agent
    // driving this page actually reads — a CSS class is invisible to it.
    document.querySelectorAll('.ws-tab').forEach(function (btn) {
      var on = btn.getAttribute('data-ws') === name;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    // Show/hide plugin cards by workspace
    document.querySelectorAll('.plugin-card').forEach(function (card) {
      card.style.display = wsMatches(card.getAttribute('data-workspaces'), name) ? '' : 'none';
    });
    // Persist selected workspace
    try { localStorage.setItem('gs_workspace', name); } catch (e) { shellWarn('localStorage', e); }
    // Phase 1B: report the tab switch to the agent (observable UI state).
    if (typeof shellApi !== 'undefined' && typeof shellApi.reportUiState === 'function') {
      shellApi.reportUiState();
    }
  }

  // Workspace tab click
  document.querySelectorAll('.ws-tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      switchWorkspace(btn.getAttribute('data-ws'));
    });
  });

  // Restore persisted workspace or default to overview
  try {
    var saved = localStorage.getItem('gs_workspace');
    switchWorkspace(saved || 'overview');
  } catch (e) { shellWarn('localStorage', e); switchWorkspace('overview'); }

  /* ── Shell API exposed to plugins ── */
  var onStateChangeCallbacks = [];
  /* Name of the panel whose renderFn is currently executing (set by
   * registerPanel). Lets subscribe() attribute a callback to the panel that
   * registered it, so a throwing callback can be reported inside that
   * panel's card only (Bug 1 hardening). */
  var _currentPanelName = null;

  function slugFor(name) {
    return String(name).replace(/\s+/g, '-').toLowerCase();
  }

  /* Show a plugin render/callback failure inside that plugin's own card.
   * Never throws and never touches other panels. */
  function showPanelError(panelName, err) {
    try {
      var slug = slugFor(panelName);
      var body = document.getElementById('plugin-body-' + slug);
      if (!body) { console.error('[shell] plugin error:', panelName, err); return; }
      var box = document.getElementById('plugin-err-' + slug);
      if (!box) {
        box = document.createElement('div');
        box.id = 'plugin-err-' + slug;
        box.setAttribute('data-testid', 'plugin-error-' + slug);
        box.className = 'gs-error';
        box.style.marginTop = 'var(--gs-space-1)';
        body.appendChild(box);
      }
      box.textContent = 'Plugin error: ' +
        (err && err.message ? err.message : String(err));
    } catch (e2) {
      /* error reporting must never kill the poll loop: fall back to the console */
      console.error('[shell] could not show plugin error:', panelName, err, e2);
    }
  }

  /* Deliver state to every subscribed plugin. A callback that throws is
   * logged and reported inside its own panel's card only; it must never
   * stop the other callbacks or the poll loop (Bug 1 hardening). */
  function dispatchState(state) {
    onStateChangeCallbacks.forEach(function (entry) {
      try {
        entry.cb(state);
      } catch (e) {
        console.error('[shell] plugin callback error:', entry.panel || 'anonymous', e);
        if (entry.panel) showPanelError(entry.panel, e);
      }
    });
  }

  var shellApi = {
    getState: function () { return currentState; },
    subscribe: function (cb, panelName) {
      onStateChangeCallbacks.push({
        cb: cb,
        panel: panelName || _currentPanelName || null,
      });
    },
    submitCommand: function (cmdId, index, value) {
      return fetch('/commands', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command_id: cmdId, index: index, value: value })
      }).then(function (r) { return r.json(); });
    },
    // S15 — slot subscription helper.
    // POSTs to the dedicated /subscribe endpoint (added S15). The /commands
    // endpoint used to interpret command_id=33 (0x21) as the subscribe
    // wrapper, but the firmware only recognises 0x21 when built and sent
    // by WifiBridge.subscribe_slot() — not as a generic 0xCC 0xDD command.
    // Body shape: { slot: int, divider: int, ranges: [string, ...] }.
    subscribeSlot: function (slot, divider, ranges) {
      var body = {
        slot:    slot,
        divider: divider || 1,
        ranges:  ranges || []
      };
      return fetch('/subscribe', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) throw new Error('subscribe HTTP ' + r.status);
        return r.json();
      });
    },
    getPlugins: function () { return window.__gs_plugins__.map(function (p) { return p.name; }); },
    // ── S5: workspace-aware plugin registration ──────────────────────
    // Register a panel with workspace and gate metadata.
    // meta: { workspace: string, gates: string[], description: string }
    registerPanel: function (name, renderFn, meta) {
      meta = meta || {};
      var dflt = PANEL_META[name] || {};
      var ws = String(meta.workspace || dflt.workspace || 'all').split(/[\s,]+/).join(' ');
      var gates = meta.gates || dflt.gates || [];
      var slug = slugOf(name);
      var grp = PANEL_GROUPS[name];
      var container = grp ? groupCard(grp.group, ws) : document.getElementById('plugin-panels');
      var card = document.createElement('div');
      card.className = grp ? 'panel-group-tab' : 'card plugin-card';
      card.id = 'plugin-' + slug;
      card.setAttribute('data-workspaces', ws);
      card.setAttribute('data-testid', 'panel-' + slug);
      card.setAttribute('data-gates', gates.join(' '));
      /* Landmark + accessible name. data-testid only helps an agent that was
       * told the selector in advance; role/aria-label put the panel in the
       * accessibility tree, which is what a browser agent reads when it has
       * to find a panel it was not briefed on. Workspace switching already
       * sets display:none, which removes hidden panels from that tree, so an
       * agent sees exactly the panels the operator sees. */
      card.setAttribute('role', 'region');
      card.setAttribute('aria-label', gates.length
        ? name + ' (requires ' + gates.join(' and ') + ')'
        : name);
      // Start hidden if not in the active workspace (a grouped panel follows its group card)
      if (!grp && !wsMatches(ws, _activeWorkspace)) card.style.display = 'none';
      var header = document.createElement('div');
      header.className = 'card-header';
      var title = document.createElement('span');
      title.className = 'card-title';
      title.textContent = name;
      header.appendChild(title);
      // Gate badge
      if (gates.length > 0) {
        var badge = document.createElement('span');
        badge.className = 'gate-badge';
        badge.style.cssText = 'font-size:var(--gs-text-xs);padding:1px 5px;border-radius:var(--gs-radius-sm);' +
          'background:var(--gs-ok-bg);color:var(--gs-ok)';
        badge.textContent = gates.join('+');
        badge.title = 'Required gates: ' + gates.join(', ');
        header.appendChild(badge);
      }
      var body = document.createElement('div');
      body.id = 'plugin-body-' + slug;
      if (!grp) card.appendChild(header);
      card.appendChild(body);
      container.appendChild(card);
      if (grp) {
        // one tab button per grouped panel; the saved tab (or the first one registered) is shown
        var gslug = slugOf(grp.group);
        var tabBtn = document.createElement('button');
        tabBtn.type = 'button';
        tabBtn.id = 'plugin-tab-' + slug;
        tabBtn.setAttribute('role', 'tab');
        tabBtn.textContent = grp.tab;
        tabBtn.title = name;
        tabBtn.addEventListener('click', function () { showGroupTab(grp.group, slug, true); });
        document.getElementById('plugin-tabs-' + gslug).appendChild(tabBtn);
        var savedTab = null;
        try { savedTab = localStorage.getItem('gs_group_tab_' + gslug); } catch (e) { shellWarn('localStorage', e); }
        var shownTab = document.getElementById('plugin-tabs-' + gslug).getAttribute('data-shown');
        if (!shownTab || savedTab === slug) {
          document.getElementById('plugin-tabs-' + gslug).setAttribute('data-shown', slug);
          showGroupTab(grp.group, slug);
        } else {
          card.style.display = 'none';
          tabBtn.className = 'gs-btn';
          tabBtn.setAttribute('aria-selected', 'false');
        }
      }
      // Bug 1 hardening: a plugin whose initial render throws gets an error
      // message inside its own card — the shell keeps running.
      _currentPanelName = name;
      try {
        renderFn(body, shellApi);
      } catch (e) {
        console.error('[shell] plugin render error:', name, e);
        showPanelError(name, e);
      } finally {
        _currentPanelName = null;
      }
    },
    // ── S5: truthful state model helpers ──────────────────────────────
    // getSignalState(slotData) → 'live'|'stale'|'degraded'|'unknown'|'replay'|'unverified'
    getSignalState: function (slotData) {
      var nowNs = Date.now() * 1e6;
      var ttlNs = (currentState && currentState.slot_freshness_ttl_ns) || 30e9;
      return getSignalState(slotData, nowNs, ttlNs);
    },
    // getGates() → { connected, disarmed, fresh, schema, command }
    getGates: function () { return Object.assign({}, _gates); },
    // getActiveWorkspace() → string
    getActiveWorkspace: function () { return _activeWorkspace; },
    // switchWorkspace(name) → void
    switchWorkspace: switchWorkspace,
    // ── S5: gated command submission ─────────────────────────────────
    // gatedCommand(cmdId, index, value, requiredGates) → Promise
    // Blocks until all requiredGates pass. Fails with descriptive error if blocked.
    gatedCommand: gatedCommand,
    // isGated(gateName) → boolean
    isGated: function (gateName) { return _gates[gateName] === false; },
    // isDisarmed() → boolean (convenience for ARM safety checks)
    isDisarmed: function () { return _gates.disarmed; },
    // getArmState() → 'armed'|'disarmed'|null (null = unknown)
    getArmState: function () { return _lastArmState; },
    // ── Phase 1B: agent SSE + UI action integration ────────────────────
    // onAgentEvent(cb) — subscribe to /api/agent/stream events. The shell
    // disambiguates event: names from the data payload, so plugins just see
    // { event, data }. Returns an unsubscribe function.
    onAgentEvent: function (cb) {
      if (typeof cb !== 'function') return function () {};
      _agentSsSubs.push(cb);
      return function () {
        var i = _agentSsSubs.indexOf(cb);
        if (i >= 0) _agentSsSubs.splice(i, 1);
      };
    },
    // getAgentControl() → current {mode, allow_agent_arm, changed_at, changed_by}
    getAgentControl: function () {
      return _agentControl || { mode: 'unknown', allow_agent_arm: false };
    },
    // reportUiState() → POST the shell's current UI state so the agent can
    // observe what the operator is looking at. Call on tab switch / drawer.
    reportUiState: function (extras) {
      var payload = {
        active_tab: _activeWorkspace,
        visible_panels: getWorkspacePanelNames(_activeWorkspace),
        drawer_open: !!(document.getElementById('copilot-drawer') &&
                        document.getElementById('copilot-drawer').classList.contains('open')),
        url: location.pathname,
      };
      if (extras) Object.keys(extras).forEach(function (k) {
        payload[k] = extras[k];
      });
      return fetch('/api/agent/ui-state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(function () { /* best effort */ });
    },
    // ackUiAction() → browser confirms it executed (or failed) a ui_action.
    ackUiAction: function (plan_id, step_id, ok, error) {
      return fetch('/api/agent/ui-ack', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan_id: plan_id, step_id: step_id,
                               ok: !!ok, error: error || null })
      }).catch(function () {});
    },
    // runUiAction() → execute a single ui_action command from the agent and
    // ack it. 'highlight' animates the [data-testid=...] target (if any).
    runUiAction: function (action) {
      var plan_id = action.plan_id, step_id = action.step_id;
      var act = action.action, args = action.args || {};
      function ack(ok, error) {
        shellApi.ackUiAction(plan_id, step_id, ok, error);
      }
      try {
        if (act === 'highlight') {
          var target = args.testid && document.querySelector(
            '[data-testid="' + window.CSS.escape(args.testid) + '"]');
          if (!target) { ack(false, 'no element matching testid=' + args.testid); return; }
          flashHighlight(target, args.text || args.label);
          ack(true);
        } else if (act === 'navigate') {
          if (typeof switchWorkspace === 'function' && args.tab) {
            switchWorkspace(args.tab);
            if (typeof shellApi.reportUiState === 'function') shellApi.reportUiState();
          }
          ack(true);
        } else if (act === 'say') {
          ack(true);
        } else {
          ack(false, 'unknown ui_action: ' + act);
        }
      } catch (e) {
        ack(false, String(e && e.message || e));
      }
    },
  }; // /shellApi
  var _lastAgentAckSeq = 0;

  /* ── Phase 1B: agent SSE stream (control/approval/plan/step/message/
   * ui_action/shell_updated/activity) → plugin dispatch + hot reload ── */
  var _agentSsSubs = [];
  function dispatchAgentEvent(event, data) {
    var msg = { event: event, data: data };
    _agentSsSubs.slice().forEach(function (cb) {
      try { cb(msg); } catch (e) { console.error('[shell] agent event cb error', e); }
    });
    // built-in control state listener
    if (event === 'control' && data && typeof data === 'object') {
      _agentControl = data;
      if (typeof renderAgentModePill === 'function') renderAgentModePill();
    }
    // ui_action executor: run it and ack back to the agent
    if (event === 'ui_action' && typeof shellApi.runUiAction === 'function') {
      shellApi.runUiAction(data);
    }
    // shell_updated → per-plugin hot reload or full-reload banner
    if (event === 'shell_updated' && data && Array.isArray(data.files)) {
      handleShellUpdated(data.files, data.at);
    }
  }
  var _agentControl = null;
  function connectAgentSSE() {
    if (!window.EventSource || window.__gs_agent_es__) return;
    var es;
    try { es = new EventSource('/api/agent/stream'); }
    catch (e) { shellWarn('agent stream', e); return; }
    window.__gs_agent_es__ = es;
    ['control', 'approval', 'plan', 'step', 'message', 'ui_action', 'shell_updated', 'activity'].forEach(function (name) {
      es.addEventListener(name, function (e) {
        try { dispatchAgentEvent(name, JSON.parse(e.data)); } catch (err) { shellWarn('agent event ' + name, err); }
      });
    });
    es.onerror = function () {
      // transient; EventSource auto-reconnects. Close on page unload only.
    };
    window.addEventListener('beforeunload', function () { es.close(); });
  }

  /* ── Phase 1B: hot reload + what-changed banner ── */
  var _hotReloaded = {};
  // Map a plugin file back to the plugin name(s) it registered, so we can
  // re-mount only that plugin instead of a full reload.
  function pluginNamesInFile(src) {
    var base = src.replace(/^.*\//, '').replace(/\.js$/, '');
    // convention: <basename>-panel.js → the plugin registers a panel; fall
    // back to scanning registered plugin names that mention the file.
    var names = window.__gs_plugins__.map(function (p) { return p.name; });
    var matches = names.filter(function (n) {
      var slug = n.replace(/\s+/g, '-').toLowerCase();
      return slug.indexOf(base) === 0 || base.indexOf(slug.split('-')[0]) === 0;
    });
    return matches.length ? matches : null;
  }
  function remountPluginFile(src) {
    // Fetch the updated file, eval it (re-registers into __gs_plugins__),
    // then re-init that plugin. The plugin's own destroy() ran implicitly when
    // the page kept running; we mount a fresh panel body for it.
    return fetch(src).then(function (res) {
      if (!res.ok) throw new Error('git ' + res.status);
      return res.text();
    }).then(function (text) {
      var names = pluginNamesInFile(src);
      eval(text); // re-registers the plugin (pushes a new entry)
      var fresh = window.__gs_plugins__.slice(-names.length || -1);
      fresh.forEach(function (p) {
        try {
          p.init(shellApi);
          _destroyFns.push(p.destroy);
          console.log('[shell] hot-reloaded plugin:', p.name);
        } catch (e) { console.error('[shell] hot-reload init error:', p.name, e); }
      });
      _hotReloaded[src] = true;
    });
  }
  function backfillChangedCard(files, names, summary) {
    var card = document.getElementById('reload-banner');
    if (card) card.classList.remove('hidden');
    var list = document.getElementById('reload-files');
    if (list) list.textContent = (names && names.length ? names.join(', ') : files.join(', '));
    var sum = document.getElementById('reload-summary');
    if (sum && summary) sum.textContent = summary;
  }
  function handleShellUpdated(files, at) {
    var pluginFiles = files.filter(function (f) { return /^plugins\/.*\.js$/.test(f); });
    // files may be bare "plugins/x.js" or full paths; normalise
    var normalized = pluginFiles.map(function (f) { return '/' + f.replace(/^\/+/, ''); });
    var sharedChanged = files.some(function (f) {
      return !/^plugins\/.*\.js$/.test(f); // index.html or shared shell file
    });
    if (sharedChanged) {
      // Preserve sessionStorage state across the reload.
      try { sessionStorage.setItem('gs_sse_state', JSON.stringify({
        control: _agentControl, at: at || Date.now() })); } catch (e) { shellWarn('sessionStorage', e); }
      backfillChangedCard(files, normalized, at ? 'shell updated' : null);
      showReloadBanner();
      return;
    }
    normalized.forEach(function (src) { remountPluginFile(src); });
  }
  // Global hook used by the code-reload plugin to hot-reload a single plugin
  // file (remount only that plugin, no full page reload).
  window.__gs_hot_reload_plugin__ = function (src) {
    return remountPluginFile(src);
  };

  function showReloadBanner() {
    var banner = document.getElementById('reload-banner');
    if (banner) {
      banner.classList.remove('hidden');
      var btn = document.getElementById('reload-now');
      if (btn) btn.onclick = function () { window.location.reload(); };
      var stay = document.getElementById('reload-stay');
      if (stay) stay.onclick = function () { banner.classList.add('hidden'); };
    }
  }
  /* highlight flash used by runUiAction('highlight') */
  function flashHighlight(el, text) {
    var cls = 'ag-highlight';
    el.classList.add(cls);
    var tip = el.getAttribute('data-ag-tip');
    if (text && !tip) { el.setAttribute('data-ag-tip', text); }
    setTimeout(function () { el.classList.remove(cls); }, 1800);
  }
  /* ── operator -> agent UI-state reporting (clicks / tab switches) ── */
  function wireUiStateReporting() {
    document.addEventListener('click', function () {
      if (typeof shellApi.reportUiState === 'function') shellApi.reportUiState({ click: true });
    }, true);
  }

  /* ── Plugin bootstrap ── */
  window.__gs_plugins__.forEach(function (p) {
    try {
      p.init(shellApi);
      _destroyFns.push(p.destroy);
    } catch (e) {
      console.error('[shell] plugin init error:', p.name, e);
    }
  });

  /* ── Helpers ── */
  function fmtTime(ns) {
    if (ns == null) return '—';
    var d = new Date(Math.floor(ns / 1e6));
    return d.toLocaleTimeString();
  }

  /* ── Rendering ── */
  let _lastSamplesRendered = null;
  let _lastUpdateRendered = null;
  function renderState(state) {
    document.getElementById('schema_id').textContent = state.schema_id || '—';
    var sidEl = document.getElementById('session_id');
    sidEl.textContent = state.session_id || '—';
    sidEl.title = state.session_id || '';
    var samplesStr = state.samples != null ? state.samples.toLocaleString() : '—';
    if (samplesStr !== _lastSamplesRendered) {
      document.getElementById('samples').textContent = samplesStr;
      _lastSamplesRendered = samplesStr;
    }
    var updateStr = fmtTime(state.last_update_ns);
    if (updateStr !== _lastUpdateRendered) {
      document.getElementById('last_update').textContent = updateStr;
      _lastUpdateRendered = updateStr;
    }
  }

  // Every innerHTML sink in this file that takes a value from outside the file
  // goes through here.  Alarm text is locally generated today, but the shell is
  // the one place where firmware symbol names, service error bodies and
  // operator text all converge, so the sink is escaped rather than audited.
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Sidebar Alarms card: the shown alarms (warning, caution) of the one shared engine in ui/alarms.js, worst
   * first, the same list the Overview banner reads. Each row names its level, the condition and the required
   * action. Silence is display only: the row dims, leaves the banner and its voice stops; the log keeps it. */
  function alarmEngine() { return window.GSAlarms ? window.GSAlarms.shared() : null; }

  function renderAlarms(alarmList) {
    var el = document.getElementById('alarm-list');
    if (!el) return;
    if (!alarmList) {
      el.innerHTML = '<div class="no-alarms">Alarm registry not loaded (ui/alarms.js): alarms unknown</div>';
      return;
    }
    if (alarmList.length === 0) {
      el.innerHTML = '<div class="no-alarms">No active alarms</div>';
      return;
    }
    el.innerHTML = alarmList.map(function (a) {
      return '<div class="alarm-item alarm-item--' + escapeHtml(a.level) + (a.silenced ? ' is-silenced' : '') +
        '" data-level="' + escapeHtml(a.level) + '"><div class="alarm-head">' +
        '<span class="gs-pill gs-pill--' + escapeHtml(a.status) + '">' + escapeHtml(a.label) + '</span>' +
        '<span>' + escapeHtml(a.text) + '</span>' +
        '<button type="button" class="gs-btn gs-btn--ghost alarm-silence" data-alarm-ref="' + Number(a.ref) + '">' +
        (a.silenced ? 'Unsilence' : 'Silence') + '</button></div>' +
        '<div class="alarm-action">&rarr; ' + escapeHtml(a.action) + '</div></div>';
    }).join('');
  }

  function updateAlarms(state) {
    var eng = alarmEngine();
    renderAlarms(eng ? eng.update(state, Date.now()) : null);
  }

  (function wireAlarmSilence() {
    var el = document.getElementById('alarm-list');
    if (!el || typeof el.addEventListener !== 'function') return;
    el.addEventListener('click', function (ev) {
      var t = ev && ev.target;
      var ref = t && t.getAttribute ? t.getAttribute('data-alarm-ref') : null;
      var eng = alarmEngine();
      if (!ref || !eng) return;
      eng.silence(Number(ref));
      renderAlarms(eng.alarms());
    });
  })();

  /* ── Record control ── */
  let _lastRecRendered = null;
  function renderRecord(rec) {
    var recBtn = document.getElementById('record-btn');
    var dot = document.getElementById('rec-dot');
    var meta = document.getElementById('rec-meta');
    if (!rec) return;
    var on = !!rec.recording;
    window.recOn = on;
    recBtn.disabled = false;
    recBtn.textContent = on ? '■ Stop' : '● REC';
    recBtn.classList.toggle('stop', on);
    dot.classList.toggle('on', on);
    if (on) {
      var s = (Date.now() / 1000) - (rec.started_at || 0);
      var metaStr = fmtClock(s) + ' · ' + fmtBytes(rec.bytes || 0);
      if (metaStr !== _lastRecRendered) { meta.textContent = metaStr; _lastRecRendered = metaStr; }
      meta.title = rec.session_dir || '';
    } else {
      if (_lastRecRendered !== '') { meta.textContent = '—'; _lastRecRendered = ''; }
      meta.title = '';
    }
    document.getElementById('note-btn').disabled = !on;
  }

  function fmtClock(s) {
    s = Math.max(0, Math.floor(s));
    var m = Math.floor(s / 60);
    var h = Math.floor(m / 60);
    m = m % 60;
    var sec = s % 60;
    function p2(n) { return (n < 10 ? '0' : '') + n; }
    if (h > 0) return h + ':' + p2(m) + ':' + p2(sec);
    return (m > 0 ? m + ':' : '') + p2(sec);
  }
  function fmtBytes(b) {
    if (b == null || isNaN(b)) return '0 B';
    if (b < 1024) return b + ' B';
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
    return (b / (1024 * 1024)).toFixed(1) + ' MB';
  }

  document.getElementById('record-btn').addEventListener('click', function () {
    var isOn = !!window.recOn;
    var url = isOn ? '/api/recording/stop' : '/api/recording/start';
    var body = isOn ? null : JSON.stringify({ requested_by: 'operator' });
    // Merge flight-test fields from flight-test-panel.js if present
    if (!isOn && typeof window.__flight_test_fields__ === 'function') {
      var ft = window.__flight_test_fields__();
      var extra = { requested_by: 'operator' };
      if (ft.analyse) extra.analyse = true;
      if (ft.controller) extra.controller = ft.controller;
      if (ft.payload) extra.payload = ft.payload;
      if (ft.notes) extra.notes = ft.notes;
      if (ft.label) extra.label = ft.label;
      body = JSON.stringify(extra);
    }
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 3000) : null;
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body,
      signal: ctl ? ctl.signal : undefined
    }).then(function (r) { return r.json(); })
      .then(function (data) { if (data) renderRecord(data); })
      .catch(function () { /* never break the render loop */ })
      .finally(function () { if (timer) clearTimeout(timer); });
  });

  document.getElementById('note-btn').addEventListener('click', function () {
    var input = document.getElementById('note-input');
    var text = (input.value || '').trim();
    var kind = document.getElementById('note-kind').value || 'note';
    if (!text) return;
    input.value = '';
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, 3000) : null;
    fetch('/api/session/note', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, kind: kind, source: 'operator' }),
      signal: ctl ? ctl.signal : undefined
    }).then(function (r) { return r.json(); })
      .catch(function () { /* never break the render loop */ })
      .finally(function () { if (timer) clearTimeout(timer); });
  });

  /* ── Polling ── */
  function setStatus(cls, text) {
    var el = document.getElementById('status');
    el.className = 'status-badge ' + cls;
    el.textContent = text;
  }

  /* Bug 1 hardening: isolate each render step so one throwing step cannot
   * abort the rest of the tick (which is what froze every panel together). */
  function safeStep(label, fn) {
    try { fn(); } catch (e) { console.error('[shell] render step failed:', label, e); }
  }

  /* A hung request must not stall the self-rescheduling loop: abort after ms. */
  function fetchJsonWithTimeout(url, ms) {
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var timer = ctl ? setTimeout(function () { ctl.abort(); }, ms) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : undefined)
      .then(function (r) { return r.json(); })
      .catch(function () { return null; })
      .finally(function () { if (timer) clearTimeout(timer); });
  }

  function poll() {
    return Promise.all([
      fetchJsonWithTimeout('/health', 3000),
      fetchJsonWithTimeout('/state', 3000),
      fetchJsonWithTimeout('/api/recording', 3000)
    ]).then(function (_ref) {
      var health = _ref[0];
      var state = _ref[1];
      var rec = _ref[2];

      if (health === null || state === null) {
        setStatus('error', 'Error');
        // the last good state keeps ageing, so "link lost" still raises while the service is unreachable
        safeStep('alarms', function () { updateAlarms(currentState); });
        return;
      }

      setStatus('connected', 'Connected');
      currentState = state;

      // S5: evaluate gates and render them on every poll
      safeStep('gates', function () { evaluateGates(state); renderGates(); });
      safeStep('sidebar', function () { renderState(state); });
      safeStep('alarms', function () { updateAlarms(state); });
      safeStep('record', function () { renderRecord(rec); });

      dispatchState(state);
    }).catch(function (e) {
      console.error('[shell] poll failed:', e);
      setStatus('error', 'Error');
    });
  }

  /* ── Polling loop (Bug 1 hardening) ──
   * Self-rescheduling chain: the next tick is armed in finally(), so no
   * failure — a synchronous throw in poll(), a rejected promise, or a
   * crashed render step — can ever stop the page from updating again.
   * A failure in one plugin or one request only affects that panel. */
  function pollForever() {
    Promise.resolve().then(poll).catch(function (e) {
      console.error('[shell] poll crashed:', e);
      setStatus('error', 'Error');
    }).finally(function () {
      setTimeout(pollForever, 500);
    });
  }

  /* ── Bootstrap ── */
  pollForever();

  /* ── Lifecycle: invoke registered destroy fns on tab close ── */
  window.addEventListener('beforeunload', function () {
    _destroyFns.forEach(function (fn) {
      try { if (typeof fn === 'function') fn(); } catch (e) { shellWarn('plugin destroy', e); }
    });
  });

  /* Expose a refresh hook so plugins (e.g. bandwidth) can request a re-render after subscribe.
   * dispatchState already isolates and reports each callback's error. */
  window.__gs_plugins_refresh__ = function () {
    dispatchState(currentState);
  };
  /* Expose the shellApi so plugins can call subscribeSlot without re-defining it. */
  window.__gs_shell_api__ = shellApi;
  /* Expose gates so plugins can query them synchronously (avoid async fetch). */
  window.__gs_gates__ = function () { return Object.assign({}, _gates); };
  /* Expose active workspace so plugins can react to workspace changes. */
  window.__gs_workspace__ = function () { return _activeWorkspace; };
  /* ── Preset-for-symbol hint (operator walkthrough 2 item 2): the shell does
   * the single read-only GET /api/preset-for-symbol and caches it, then hands
   * plugins a synchronous lookup. This keeps read-only plugins (e.g. the
   * overview data-flow blocks) free of any `fetch`/network call of their own
   * while still letting an empty block say "not published: in preset X". */
  window.__gs_preset_for_symbol = (function () {
    var cache = {};
    function fill(key) {
      if (cache[key] !== undefined) return;
      cache[key] = null;   // in-flight sentinel
      try {
        fetch('/api/preset-for-symbol?symbol=' + encodeURIComponent(key))
          .then(function (r) { return r.json(); })
          .then(function (b) { cache[key] = (b && b.presets) || []; })
          .catch(function (e) { cache[key] = []; shellWarn('preset-for-symbol', e); });
      } catch (e) { cache[key] = []; shellWarn('preset-for-symbol', e); }
    }
    return function (symbol) {
      var key = String(symbol || '');
      if (!key) return [];
      fill(key);
      return cache[key];   // null while the fetch is in flight; carriers[] after
    };
  })();

  /* ── Phase 1B init: agent SSE, ui-state reporting ── */
  function getWorkspacePanelNames(ws) {
    return window.__gs_plugins__
      .filter(function (p) { return String(p.workspace).split(/\s/).indexOf(ws) >= 0; })
      .map(function (p) { return p.name; });
  }
  connectAgentSSE();
  wireUiStateReporting();

})();
</script>
