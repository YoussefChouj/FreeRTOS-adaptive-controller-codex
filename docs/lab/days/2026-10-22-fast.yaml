# Lab day 2026-10-22, fast deck: fly it with `.\labday 2026-10-22-fast`, AFTER `.\labday 2026-10-22` (camera mode is per deck).
# D8 (docs/research/2026-10-22-d8-drift-figure8.md): on 10-21 speed-ladder-1 and -2 the OF EKF health check tripped on a
# fast lap and latched FIXED bias mode; camera mode 3 applies a fix only while the EKF is active
# (TASK/StabilizerTask.c:966), so the camera stopped correcting and the drift grew to 118 cm. Mode 2 calls
# ext_pos_step whatever the bias mode is (TASK/StabilizerTask.c:982-988), so a trip should not cut the camera.
# These rungs test that, not tracking: the x lobe at 0.37-0.50 Hz is past the position-loop bandwidth (D8 part 2),
# so a large tracking error on the fast laps is expected and is not a fail.
# Not carried to other days (the file name is not a date). A rung not flown well stays on this list.
day: 2026-10-22
carry: false
title: rate-loop sysID (roll, pitch multisine), then speed ladder rungs 0-2 with camera fusion mode 2, to check that the camera keeps correcting after an OF EKF trip
camera:
  floor: floor-1022           # same scan as the main deck
  mode: 2                     # camera corrects ano_of.earth_x/y in any bias mode (D8 fix A)
  args: [--yaw-deg, "94", --delay-ms, "330"]
before:
  - "Main deck 2026-10-22 done or stopped; 8081 running, `arm 0`, landing pad clear"
  - "Tracker window: the dot sits on the drone center while parked before arming"
flights:
  - id: rate-sysid-roll-pitch
    fly: lab_d_excite
    why: "Plan: sysID after the smoke hover. Roll then pitch rate-loop multisine (0.5-15 Hz, 60 deg/s, 30 s each), MRAC injection off. Needs camera mode 2 (each excite re-zeroes the flow origin; mode 3 pulls it back mid-run), so it sits in this deck"
    pass: "both excites run to the end; then on the ground `python -m ground_station.autotune.cli <session> --axis roll` (and pitch) gives a fit (PROPOSED: fit and validation numbers are D7's to judge)"
  - id: speed-ladder-0-mode2
    fly: lab_h_speed_ladder_l0
    why: "Rung 0 (15 deg cap) never tripped on 10-21: the mode 2 baseline"
    pass: "camera minus estimate (g_ext_pos.e_x/e_y) median <= 5 cm on the slow blocks (10-21 mode 3: 2-3 cm)"
  - id: speed-ladder-1-mode2
    fly: lab_h_speed_ladder_l1
    why: "Rung 1 tripped at 60-70 s on 10-21 and stayed at 11-16 cm after the trip"
    pass: "after any g_ekf_of_fallback 0 -> 1, camera minus estimate falls back below 5 cm within 10 s (PROPOSED)"
  - id: speed-ladder-2-mode2
    fly: lab_h_speed_ladder_l2
    why: "Rung 2 tripped at 20-30 s on 10-21 and drifted to 118 cm"
    pass: "camera minus estimate stays inside the 40 cm gate after the trip (PROPOSED); LOW_V ends it early = re-fly on a full pack"
    stop: true
branches:
  - {when: '"NO FIX SENT" or the dot off the drone', do: "Land, check the tracker, re-fly (r at the auto-stop prompt)"}
  - {when: "Camera minus estimate grows past 40 cm after a trip in mode 2", do: "Land; D8 fix A does not hold; tell me"}
  - {when: Tilt trip or fence stop, do: "Land; tell me before the next flight"}
  - {when: "Pack at the packs.yaml gate (gate_soc_pct, post-flight, ground only)", do: "Swap before the next flight; give the new type when fly asks"}
