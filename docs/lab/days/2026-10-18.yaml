# Lab day 2026-10-18: fly it with `.\labday 2026-10-18` (add `--pack 2` once after a type-2 swap; ground_station/lab/labday.py).
# `.\labday 2026-10-18 --list` shows what is flown; the same command again goes on from the first flight not flown.
# Each flight is `.\fly <fly> --once <args>`; `stop: true` = analysis stop after it. Pass marks are PROPOSED.
# Firmware 840ede09 is flashed (10-18, exit 0, disarmed). m1-u100 (logs/video_truth/m1-u100) was a manual test flight.
day: 2026-10-18
title: gate-memory premise (MRAC u100 vs u0, n=3 per arm, interleaved), then Z ground effect and v_z steps
camera:                       # camera_truth.sh fusion <id-fly> <mode> <args>, CT_FLOOR=logs/video_truth/<floor>
  floor: floor-1018
  mode: 3
  args: [--yaw-deg, "94"]
before:
  - "8081 running, `arm 0`, landing pad clear, camera in the recording position"
flights:
  - id: mem1
    fly: lab_m_memory_u100
    why: "memory u100 #1 (A hold, B figure-8, A hold) and the first flight at the 64600 B/s computed log plan"
    pass: "figure-8 completes; stream gaps small (I check them at this stop; fallback = `slow 25` plan)"
    stop: true
  - id: mem2
    fly: lab_m_memory_u0
    why: memory u0 #1 (MRAC injection 0, the control arm)
    pass: figure-8 completes
  - id: mem3
    fly: lab_m_memory_u100
    why: memory u100 #2
    pass: figure-8 completes
  - id: mem4
    fly: lab_m_memory_u0
    why: memory u0 #2
    pass: figure-8 completes
  - id: mem5
    fly: lab_m_memory_u100
    why: memory u100 #3
    pass: figure-8 completes
  - id: mem6
    fly: lab_m_memory_u0
    why: memory u0 #3 (n=3 per arm reached)
    pass: figure-8 completes
    stop: true
  - id: z1
    fly: lab_z_ground_effect
    why: Z ground effect (thrust vs height near the pad)
    pass: holds at each height; lands on the pad
  - id: z2
    fly: lab_z_vz_steps
    why: Z vertical drag (v_z steps)
    pass: steps complete; lands on the pad
    stop: true
branches:
  - {when: mem1 shows big stream gaps, do: "I drop the memory flights to the `slow 25` plan (35500 B/s computed), then go on"}
  - {when: '"NO FIX SENT"', do: "Land, check the tracker, re-fly (r at the auto-stop prompt)"}
  - {when: Tilt trip or fence stop, do: "Land; tell me before the next flight"}
  - {when: "Pack at the packs.yaml gate (gate_soc_pct, post-flight, ground only)", do: "Swap before the next flight; give the new type when fly asks"}
