    pass: "full script completes; beats all-layers-off on layer_ab metrics (PROPOSED)"
  - id: all-layers-both-2
    fly: lab_l_all_both
    why: "Full multi-time-scale stack A/B repeat (B)"
    pass: "full script completes (PROPOSED)"
  - id: all-layers-off-2
