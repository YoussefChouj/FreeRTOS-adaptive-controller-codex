# Lab day 2026-10-24: fly it with `.\labday 2026-10-24` (add `--pack 2` once after a type-2 swap; ground_station/lab/labday.py).
# `.\labday 2026-10-24 --list` shows what is flown; the same command again goes on from the first flight not flown.
# Each flight is `.\fly <fly> --once <args>`; `stop: true` = analysis stop after it. Pass marks are PROPOSED.
# Copy of 2026-10-23 plus the new MRAC flights (spec: docs/design/2026-10-24-lab-prep-mrac-flights.md sec. 4).
# Ordering rules (Gate W, docs/lab/2026-10-24-prep-report.md):
# - Every matched reference flight (`*-plus-mrac-matched`) flies right after its unmatched sibling (`*-plus-mrac`),
#   followed by a DIFFERENT controller kind so a fitted reference never carries over into an unmatched flight of the
#   same kind.
# - `prior-warm` flies after `pattern-learn` (`mrac_prior from=latest:lab-p-pattern-learn`).
# - Missing inputs at day start (`logs/ref_fit/<kind>.json`, `latest:lab-p-pattern-learn`, or all-loop firmware fields)
#   compile to `refuse` ground writes so `--dry-run` passes and only an unready flight is refused before arming.
day: 2026-10-24
carry: false
title: smoke hover on the new flash, memory MRAC on/off balance (3 off, 2 on), ADRC / LQR / MPC alone retests with 21-tick delay, PID reference arm, XY layer A/B, matched vs unmatched MRAC references, pattern-learned prior A/B, and all-loop MRAC layers
camera:                       # camera_truth.sh fusion <id-fly> <mode> <args>, CT_FLOOR=logs/video_truth/<floor>
  floor: floor-1024           # scan at the lab with drone out of view: .\cam floor floor-1024
  mode: 3                     # in-EKF, same as 10-21 so the memory A/B pools
  args: [--yaw-deg, "94", --delay-ms, "330"]  # yaw valid only if the drone BOOTS on the pad facing its usual way; delay = 10-21 screen-flash test
before:
  - "Probe plugged in, drone powered and DISARMED, 8081 stopped (it locks the .axf): `python -m ground_station.flashtool.rebuild_and_flash --yes` (never --force; stop on a non-zero exit)"
  - "After the flash: `python -m ground_station.livewatch verify`, then `python -m pytest ground_station/livewatch/tests/test_campaign_capture.py -q`"
  - 'Scan floor with drone out of view: `.\cam floor floor-1024`'
  - "8081 running, `arm 0`, landing pad clear, camera in the recording position"
  - "Tracker window: the dot sits on the drone center while parked before arming (if not: land, `r`, tell me)"
  - "Camera delay re-measure (the tracker changed on 10-22): the 10-21 screen-flash test (photon -> tracker read, median of n 60, commit a772d620), once with --serial-grab and once without for the fps A/B; new median + read wait goes in camera.args --delay-ms of all three decks. After smoke-hover, cross-check offline with video_truth.tilt_delay"
  - "Ground step after the three `*-alone-retest` flights (before the matched block): run `python -m ground_station.analysis.mrac_ref_fit <session> --kind lqr`, `--kind mpc`, and `--kind adrc` to write `logs/ref_fit/{lqr,mpc,adrc}.json`"
flights:
  - id: smoke-hover
    fly: lab_s_smoke
    why: "First flight on the new flash (82f4f250 gate mask + 5486a26b ADRC wo 12): hover, the preset paths, land on the pad"
    pass: "every traj_go accepted; lands inside the pad gate; drift_nn.steps > 0"
  - id: memory-mrac-off-6
    fly: lab_m_memory_u0
    why: "Memory A/B balance: off arm is 2 short of the on arm after 10-21 (off n=3, on n=5)"
    pass: "flies the full script without an L1 abort; position error logged for the A/B"
  - id: memory-mrac-on-6
    fly: lab_m_memory_u100
    why: "Memory A/B, on arm, interleaved with off so pack and temperature drift hit both arms"
    pass: "flies the full script without an L1 abort"
  - id: memory-mrac-off-7
    fly: lab_m_memory_u0
    why: "Memory A/B, off arm"
    pass: "flies the full script without an L1 abort"
  - id: memory-mrac-on-7
    fly: lab_m_memory_u100
    why: "Memory A/B, on arm"
    pass: "flies the full script without an L1 abort"
  - id: memory-mrac-off-8
    fly: lab_m_memory_u0
    why: "Memory A/B, off arm (n=6 off / n=7 on if pooled with 10-21)"
    pass: "flies the full script without an L1 abort"
    stop: true
  - id: adrc-alone-retest
    fly: lab_e_exp_adrc_u0
    why: "10-21 adrc-alone aborted at hold 0 (L1 oscillation). Retest with ADRC wo 12 (5486a26b) and VAR 47 = 21; MRAC learns, injection off"
    pass: "3 s hold and the figure-8 without an L1 abort; rms error within 20 % of pid-alone-ref (PROPOSED)"
  - id: lqr-alone-retest
    fly: lab_e_exp_lqr_u0
    why: "LQR with the Smith predictor at the measured 21 ticks (10-21 ran 12, 9 ticks short); MRAC injection off"
    pass: "no sustained xy oscillation in the hold (peak-to-peak < 10 cm, PROPOSED); figure-8 completes"
  - id: mpc-alone-retest
    fly: lab_e_exp_mpc_u0
    why: "10-21 mpc-alone aborted at hold 0 (L1 position_error). Retest with VAR 47 = 21; MRAC learns, injection off"
    pass: "3 s hold and the figure-8 without an L1 abort"
  - id: pid-alone-ref
    fly: lab_e_exp_pid_u0
    why: "Same-day reference arm for the three retests (same exp script, PID xy, injection off)"
    pass: "figure-8 completes; within 10 % of 10-21 pid-alone (PROPOSED)"
    stop: true
  # ---- CUT LINE: below here only if packs and time allow. Not flown today = carried to the next day automatically. ----
  - id: pid-plus-mrac
    fly: lab_e_exp_matrix
    why: "PID + xy MRAC (the matched reference): repeat of 10-21 for n=2 against pid-alone-ref"
    pass: "figure-8 completes; position error vs pid-alone-ref logged"
  - id: adrc-plus-mrac-mismatched
    fly: lab_e_exp_adrc_3l
    why: "D3 demo: MRAC whose reference is the PID demand, around ADRC. Fly ONLY if adrc-alone-retest passed. Label in the thesis as a mismatched reference, not as ADRC + MRAC"
    pass: "no pass mark: the sim predicts more saturation than adrc-alone-retest; abort limits stay as they are"
  - id: pid-track
    fly: lab_c_pid
    why: "10-14 anchor: drift check for the day (pack, temperature, props)"
    pass: "within 10 % of 10-21 pid-track-start (PROPOSED)"
    stop: true
  # ---- New MRAC flights (spec docs/design/2026-10-24-lab-prep-mrac-flights.md sec. 4) ----
  # Ground step before the matched flights: run `python -m ground_station.analysis.mrac_ref_fit <session> --kind lqr|mpc|adrc`
  # on lqr-alone-retest, mpc-alone-retest, and adrc-alone-retest to write logs/ref_fit/{lqr,mpc,adrc}.json.
  - id: xy-layer-inner-1
    fly: lab_e_xyl_inner
    why: "XY layer A/B (A B C C B A): velocity loop only adapts"
    pass: "figure-8 completes; within 10 % of pid-alone-ref (PROPOSED)"
  - id: xy-layer-outer-1
    fly: lab_e_xyl_outer
    why: "XY layer A/B: position loop only adapts"
    pass: "figure-8 completes; within 10 % of pid-alone-ref (PROPOSED)"
  - id: xy-layer-both-1
    fly: lab_e_xyl_both
    why: "XY layer A/B: both position and velocity loops adapt"
    pass: "figure-8 completes; beats xy-layer-inner on layer_ab control metrics (PROPOSED)"
  - id: xy-layer-both-2
    fly: lab_e_xyl_both
    why: "XY layer A/B repeat in reversed order (A B C C B A) so pack drift hits every arm"
    pass: "figure-8 completes; same-arm spread logged (PROPOSED)"
  - id: xy-layer-outer-2
    fly: lab_e_xyl_outer
    why: "XY layer A/B repeat: position only"
    pass: "figure-8 completes; same-arm spread logged (PROPOSED)"
  - id: xy-layer-inner-2
    fly: lab_e_xyl_inner
    why: "XY layer A/B repeat: velocity only"
    pass: "figure-8 completes; run `python -m ground_station.analysis.layer_ab 2026-10-24 --arms xy-layer-inner,xy-layer-outer,xy-layer-both --ref xy-layer-inner` (PROPOSED)"
    stop: true
  # Matched flights: each matched flight sits right after its unmatched sibling, followed by a different controller kind (Gate W).
  - id: lqr-plus-mrac
    fly: lab_e_exp_lqr_3l
    why: "Unmatched LQR + 3-layer MRAC sibling immediately before lqr-plus-mrac-matched"
    pass: "figure-8 completes without an L1 abort (PROPOSED)"
  - id: lqr-plus-mrac-matched
    fly: lab_e_exp_lqr_matched
    why: "MRAC with LQR's own fitted reference (logs/ref_fit/lqr.json from lqr-alone-retest)"
    pass: "figure-8 completes; lower tracking error and saturation than lqr-plus-mrac (PROPOSED)"
  - id: mpc-plus-mrac
    fly: lab_e_exp_mpc_3l
    why: "Unmatched MPC + 3-layer MRAC sibling immediately before mpc-plus-mrac-matched (different kind after LQR)"
    pass: "figure-8 completes without an L1 abort (PROPOSED)"
  - id: mpc-plus-mrac-matched
    fly: lab_e_exp_mpc_matched
    why: "MRAC with MPC's own fitted reference (logs/ref_fit/mpc.json from mpc-alone-retest)"
    pass: "figure-8 completes; lower tracking error and saturation than mpc-plus-mrac (PROPOSED)"
  - id: adrc-plus-mrac-matched
    fly: lab_e_exp_adrc_matched
    why: "MRAC with ADRC's own fitted reference (logs/ref_fit/adrc.json from adrc-alone-retest); pairs with adrc-plus-mrac-mismatched (different kind after MPC)"
    pass: "figure-8 completes; lower saturation and hold error than adrc-plus-mrac-mismatched (PROPOSED)"
    stop: true
  # Pattern-learn and prior cold/warm A/B (prior-warm after pattern-learn, interleaved n=2)
  - id: pattern-learn
    fly: lab_p_pattern_learn
    why: "Learn Theta from a slow outer x,y Schroeder pattern with MRAC injection off, then figure-8"
    pass: "pattern and figure-8 complete without an L1 abort; mrac_theta logged for prior-warm (PROPOSED)"
  - id: prior-cold
    fly: lab_p_prior_cold
    why: "Prior A/B baseline (run 1): MRAC starts from zero Theta"
    pass: "figure-8 completes; initial transient error logged vs pid-alone-ref (PROPOSED)"
  - id: prior-warm
    fly: lab_p_prior_warm
    why: "Prior A/B warm arm (run 1): MRAC starts from latest:lab-p-pattern-learn Theta"
    pass: "figure-8 completes; faster convergence than prior-cold (PROPOSED)"
  - id: prior-cold-2
    fly: lab_p_prior_cold
    why: "Prior A/B baseline repeat (n=2, interleaved)"
    pass: "figure-8 completes (PROPOSED)"
  - id: prior-warm-2
    fly: lab_p_prior_warm
    why: "Prior A/B warm arm repeat (n=2, interleaved)"
    pass: "figure-8 completes; beats prior-cold beyond same-arm spread (PROPOSED)"
    stop: true
  # All-loop layer block (needs the all-loop firmware flashed; refused cleanly on the ground until merged+flashed)
  - id: att-layer-inner-1
    fly: lab_l_att_inner
    why: "Attitude layer A/B (A B C C B A): roll multisine with MRAC on rate loop only"
    pass: "multisine completes; gain/phase margin inside band on layer_ab (PROPOSED)"
  - id: att-layer-outer-1
    fly: lab_l_att_outer
    why: "Attitude layer A/B: roll multisine with MRAC on angle loop only"
    pass: "multisine completes (PROPOSED)"
  - id: att-layer-both-1
    fly: lab_l_att_both
    why: "Attitude layer A/B: roll multisine with MRAC on both rate and angle loops"
    pass: "multisine completes (PROPOSED)"
  - id: att-layer-both-2
    fly: lab_l_att_both
    why: "Attitude layer A/B repeat (C)"
    pass: "multisine completes (PROPOSED)"
  - id: att-layer-outer-2
    fly: lab_l_att_outer
    why: "Attitude layer A/B repeat (B)"
    pass: "multisine completes (PROPOSED)"
  - id: att-layer-inner-2
    fly: lab_l_att_inner
    why: "Attitude layer A/B repeat (A)"
    pass: "multisine completes (PROPOSED)"
    stop: true
  - id: z-layer-inner-1
    fly: lab_l_z_inner
    why: "Altitude layer A/B (A B C C B A): z steps with MRAC on z velocity only"
    pass: "three z steps complete inside fence (PROPOSED)"
  - id: z-layer-outer-1
    fly: lab_l_z_outer
    why: "Altitude layer A/B: z steps with MRAC on z position only"
    pass: "three z steps complete inside fence (PROPOSED)"
  - id: z-layer-both-1
    fly: lab_l_z_both
    why: "Altitude layer A/B: z steps with MRAC on both z velocity and z position"
    pass: "three z steps complete inside fence (PROPOSED)"
  - id: z-layer-both-2
    fly: lab_l_z_both
    why: "Altitude layer A/B repeat (C)"
    pass: "three z steps complete inside fence (PROPOSED)"
  - id: z-layer-outer-2
    fly: lab_l_z_outer
    why: "Altitude layer A/B repeat (B)"
    pass: "three z steps complete inside fence (PROPOSED)"
  - id: z-layer-inner-2
    fly: lab_l_z_inner
    why: "Altitude layer A/B repeat (A)"
    pass: "three z steps complete inside fence (PROPOSED)"
    stop: true
  - id: yaw-layer-inner-1
    fly: lab_l_yaw_inner
    why: "Heading layer A/B (A B C C B A): yaw steps with MRAC on yaw rate only"
    pass: "three yaw steps complete (PROPOSED)"
  - id: yaw-layer-outer-1
    fly: lab_l_yaw_outer
    why: "Heading layer A/B: yaw steps with MRAC on yaw angle only"
    pass: "three yaw steps complete (PROPOSED)"
  - id: yaw-layer-both-1
    fly: lab_l_yaw_both
    why: "Heading layer A/B: yaw steps with MRAC on both yaw rate and yaw angle"
    pass: "three yaw steps complete (PROPOSED)"
  - id: yaw-layer-both-2
    fly: lab_l_yaw_both
    why: "Heading layer A/B repeat (C)"
    pass: "three yaw steps complete (PROPOSED)"
  - id: yaw-layer-outer-2
    fly: lab_l_yaw_outer
    why: "Heading layer A/B repeat (B)"
    pass: "three yaw steps complete (PROPOSED)"
  - id: yaw-layer-inner-2
    fly: lab_l_yaw_inner
    why: "Heading layer A/B repeat (A)"
    pass: "three yaw steps complete (PROPOSED)"
    stop: true
  - id: all-layers-off-1
    fly: lab_l_all_off
    why: "Full multi-time-scale stack A/B (A B B A): all MRAC layers off across figure-8 + roll multisine + z/yaw steps"
