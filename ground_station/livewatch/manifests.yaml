  # -------------------------------------------------------------------------
  # dashboard_frame_a — drop-in replacement for the legacy UART5 Frame A
  # stream, routed over the USART3 subscribe path on slot 0 at 20 Hz.
  #
  # Source: ground_station/comm/wifi_bridge.py::_decode_frame_a (and the
  # _decode_frame_a_uart4 sibling). The legacy Frame A payload layout is:
  #   [8×f32: MRAC pitch/roll/yaw/z e+u_ad = 32 B]
  #   [9×u8:  status flags = 9 B]
  # so this manifest exposes those fields plus attitude + battery under
  # their DWARF paths.
  #
  # Rate rationale (2026-09-12 wire-budget lesson):
  #   - User-requested "20 Hz" maps to host hz=50 with effective Send_Task
  #     cadence ~80 Hz -> divider=int(200/50)=4 -> 80/4=20 Hz measured.
  #   - 20 vars * 4 B = 80 B payload, data frame 12+80=92 B, 20 Hz
  #     -> 1.84 KB/s on USART3 (0.20% of 921,600 B/s wire) -- well inside
  #     the 80% host guard.
  #
  # Why slot 0: legacy Frame A was on UART5 and never conflicted with the
  # boot-default slot-0 subscribe. Re-using slot 0 here means the host's
  # _slot0_to_sidebar() (extended for MRAC + status flags) republishes the
  # payload under tag "a" so the dashboard sidebar updates without changes
  # to the dashboard code itself. The firmware boot-default 12 vars at
  # divider 20 are now superseded -- the host's
  # ``WifiBridge._request_slot0_schema(layout="dashboard")`` re-subscribes
  # slot 0 with this var list at divider 4 over the same wire id.
  #
  # The legacy UART5 Frame A stream continues to run in MIXED mode and the
  # dashboard also keeps reading it; once MIXED mode is dropped (separate
  # task) this manifest becomes the only source of those sidebar keys.
  # -------------------------------------------------------------------------

  dashboard_frame_a:
    doc: >
      Dashboard sidebar payload, slot 0 at 20 Hz. Mirrors legacy Frame A.
      MRAC e/u_ad for all 4 axes + status flags + attitude + battery.
      Plus xTickCount so this manifest satisfies REQUIRED_SYNC_VARS on its
      own (a multi-slot preset can put it on slot 0 without needing a
      separate `sync` manifest).
      Size: 21 vars * 4 B = 84 B payload + 12 B overhead = 96 B/frame.
    hz: 50     # host hz=50 -> divider=4 -> measured 20 Hz in MIXED mode
    vars:
      # Attitude (3 vars) -- dashboard attitude display + Euler sidebar
      - imu_data.rol
      - imu_data.pit
      - imu_data.yaw
      # MRAC e + u_ad for the 4 axes the dashboard bar monitor reads
      # (lines 2089-2099 of dashboard.py). 8 vars * 4 B = 32 B -- the exact
      # size of the legacy Frame A's MRAC block.
      - mrac_state.pitch.e
      - mrac_state.pitch.u_ad
      - mrac_state.roll.e
      - mrac_state.roll.u_ad
      - mrac_state.yaw.e
      - mrac_state.yaw.u_ad
      - mrac_state.z_rate.e
      - mrac_state.z_rate.u_ad
      # Status flags (9 vars, 1 B each packed as 4 B in subscribe path).
      # DWARF paths resolved against live ELF (livewatch names 2026-09-12):
      #   status.arm            -> DroneStatus.ARM_Status
      #   status.flymode        -> DroneStatus.FlyMode
      #   status.sbus_lost      -> sbus_lost  (API/rc_input.h)
      #   status.twc_execute    -> TWC.execute (TWC is a 36-byte struct -- only
      #                          the u32 `execute` field fits the 1/2/4 protocol)
      #   status.twc_arrived    -> TWC_arrived
      #   status.rc_authority   -> s_authority  (Remoter task authority flag)
      #   status.of_hold        -> g_of_hold_active
      #   status.estimator_ready-> g_estimator_ready
      - DroneStatus.ARM_Status
      - DroneStatus.FlyMode
      - sbus_lost
      - TWC.execute
      - TWC_arrived
      - s_authority
      - g_of_hold_active
      - g_estimator_ready
      # Battery voltage (1 var) -- vbat sidebar.
      # NOTE: this manifest uses `real_voltage` (not `DroneStatus.vbat`) to
      # match the firmware's boot_default subscribe in API/subscribe.c and
      # the BOOT_DEFAULT_VARS tuple in boot_default_layout.py. The previous
      # boot_default manifest's `DroneStatus.vbat` was a divergence -- it
      # never matched what the firmware was emitting on slot 0.
      - real_voltage
      # Monotonic ms clock -- required so this manifest alone satisfies
      # REQUIRED_SYNC_VARS (multi-slot presets can use it on slot 0 in
      # place of the lean `sync` manifest).
      - xTickCount

  # -------------------------------------------------------------------------
  # Bias frame — drives the DearPyGui dashboard Bias tab (WiFi mode).
  #
  # In WiFi mode, wifi_bridge never handles frame 0x05 (OF calibration), so
  # _telem["of"] stays empty and the Bias tab shows "?".  This manifest
  # subscribes to the bias variables over the standard subscribe path (slot 1)
  # and injects them into _telem["of"] in _multislot_run, populating the
  # Bias tab without any wifi_bridge changes.
  #
  # Units (DWARF float, verified against source + live reads):
  #   s_cal_hot.b_g   -- gyro bias in rad/s  (calib.h: "rad/s")
  #   s_cal_trim.b_a  -- accel bias in m/s² (calib.h: "m/s^2")
  #   s_of_bias_x/y   -- OF velocity bias in m/s (raw sensor units)
  #
  # The subscribe decoder emits DWARF floats directly.  The display widgets
  # apply the inverse of the injection multiplier so the Bias tab shows the
  # same physical value in WiFi mode as it does in serial mode.
  # -------------------------------------------------------------------------
  bias_frame:
    doc: >
      Bias tab variables: OF bias mode + EMA freeze, calibration health,
      gyro/accel bias from s_cal_hot/s_cal_trim, and OF velocity bias.
      Use as slot 1 in the bias_logging preset (slot 0 = dashboard_frame_a).
      At 10 Hz this is cheap (~100 B/frame).  No REQUIRED_SYNC_VARS needed
      because slot 0 covers them in the bias_logging preset.
    hz: 10
    vars:
      # OF bias mode + EMA freeze flag (ADR-0011 Phase 1)
      - g_of_bias_mode
      - g_of_bias_ema_freeze
      # Calibration health (u16 bitmask)
      - g_cal_health
      # Gyro bias (rad/s from s_cal_hot.b_g[0..2])
      - s_cal_hot.b_g[0]
      - s_cal_hot.b_g[1]
      - s_cal_hot.b_g[2]
      # Accel bias (m/s² from s_cal_trim.b_a[0..2]) -- display widget ×1000 → mg
      - s_cal_trim.b_a[0]
      - s_cal_trim.b_a[1]
      - s_cal_trim.b_a[2]
      # OF velocity bias (m/s raw sensor units)
      - s_of_bias_x
      - s_of_bias_y
