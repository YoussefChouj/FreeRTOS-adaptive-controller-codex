        - IMU: gyro (raw + LPF), euler angles
        - PID: all 6 loops (outer: roll/pitch/yaw; inner: gyrox/gyroy/gyroz; z: pos/rate)
        - MRAC: state + config for all 4 axes (roll/pitch/yaw/z_rate)
        - Motors: PWM + RPM
        - EKF: 9-state
        - System: task counters, RC channels, TWC
      Sized for 20 Hz. RANGE-PACKED to fit within 62-range firmware limit.
      Uses 30 ranges total (well under limit). All variables verified against DWARF 2026-09-09.
    hz: 20
    vars:
      # IMU (3 ranges)
      - imu_data.rol
      - imu_data.pit
      - imu_data.yaw
      - sensor.Gyro_deg[0]
      - sensor.Gyro_deg[1]
      - sensor.Gyro_deg[2]
