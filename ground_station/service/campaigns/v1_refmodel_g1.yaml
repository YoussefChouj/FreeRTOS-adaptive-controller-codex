# WP-27 battery 2b (docs/workflow-b/mrac-variants.md): MRAC V1 injected at gamma x1, after v1_refmodel passed.
# Start: apply_params(presets.v1_refmodel_g1) from controllers/mrac_v1.yaml on the ground; end: presets.restore.
# Pass: no abort and figure-8 position RMSE <= 1.1 x pid_ref. PROPOSED.
campaign: v1_refmodel_g1
objective: "MRAC V1 injected at gamma x1: doublet and dense figure-8"
controller: mrac_v1
mode: fly
packs:
  - P4000-1
max_flights: 2
experiments:
  - name: doublet
    scenario:
      scenario: mrac-doublet
      description: goto x +0.4 / -0.4 then y +0.4 / -0.4, dwell 3 s, back to the hover point each time
      steps:
        - takeoff: {z: 0.8, mrac_injection: 1}
        - hold: {s: 3}
        - goto: {x: 0.4, y: 0.0, z: 0.8, dwell_s: 3.0}
        - goto: {x: -0.4, y: 0.0, z: 0.8, dwell_s: 3.0}
        - goto: {x: 0.0, y: 0.4, z: 0.8, dwell_s: 3.0}
        - goto: {x: 0.0, y: -0.4, z: 0.8, dwell_s: 3.0}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
  - name: figure8
    scenario:
      scenario: mrac-figure8
      description: figure-8 width 1.0 height 0.5 at 0.3 m/s, 2 laps
      steps:
        - takeoff: {z: 0.8, mrac_injection: 1}
        - hold: {s: 3}
        - path: {shape: figure8, params: {width_m: 1.0, height_m: 0.5}, v_cruise_mps: 0.3}
        - path: {shape: figure8, params: {width_m: 1.0, height_m: 0.5}, v_cruise_mps: 0.3}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
abort: {tilt_deg: 12, pos_err_m: 0.5, sat_window_s: 0.5}
