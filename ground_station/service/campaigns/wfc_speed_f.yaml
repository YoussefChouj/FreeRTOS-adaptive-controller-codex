# Workflow-C flight series D-H (2026-10-07), flown by hand after step C, one campaign per flight:
#   python -m ground_station.service.campaign_fly <launch copy> --pack <id> --run <run folder>
# Camera sees only about +0.4-0.5 m of +y from the pad, so every shape stays at y <= +0.35 (most at y <= 0).
# Every trajectory starts and ends at the pad hover (firmware). Airborne cap 120 s (API/wfb_safety.c); each upload
# cost about 5.3 s of hover in step B. Timings in the comments are schedule estimates; projections are PROPOSED.
# F speed ladder: stop-and-go lines, x to +0.9, through the pad to -0.9, back (0.4 then 0.6 m/s), then y to -1.0
# and back (0.4 m/s). Reads: flow scale and lag vs speed (flow rate saturation), braking overshoot, tilt vs thrust.
campaign: wfc-speed-f
objective: "stop-and-go lines: x +-0.9 m at 0.4 and 0.6 m/s, y to -1.0 m at 0.4 m/s, 2 s stops, 0.8 m"
controller: pid
mode: fly
packs:
  - P4000-1
max_flights: 1
experiments:
  - name: f01_speed
    scenario:
      scenario: speed-f
      description: "stop-and-go lines: x +-0.9 m at 0.4 and 0.6 m/s, y to -1.0 m at 0.4 m/s, 2 s stops, 0.8 m"
      motion: {v_cruise_mps: 0.3, a_max_mps2: 0.5, ds_m: 0.05}
      steps:
        - takeoff: {z: 0.8}
        - hold: {s: 3}
        - hold: {s: 5}
        - path: {shape: waypoints, params: {points_m: [[0.9, 0], [-0.9, 0]], dwell_s: 2}, v_cruise_mps: 0.4}
        - hold: {s: 2}
        - path: {shape: waypoints, params: {points_m: [[0.9, 0], [-0.9, 0]], dwell_s: 2}, v_cruise_mps: 0.6}
        - hold: {s: 2}
        - path: {shape: waypoints, params: {points_m: [[0, -1.0]], dwell_s: 2}, v_cruise_mps: 0.4}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 50, groups: [estimator_truth, optical_flow, velocity_loops, takeoff_gate, thrust_model, ekf_states]}
abort: {}
