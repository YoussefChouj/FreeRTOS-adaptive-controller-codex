# Lab 2026-10-06 demo: payload and dense waypoint following on the PID baseline (docs/agent/lab-2026-10-06.md).
# Three load cases flown in order, three flights each: no load, symmetric load (centred under the CG), asymmetric
# load (same mass, off-centre on one arm). The operator mounts or moves the payload on the ground before each
# no-load -> sym -> asym switch, then arms by RC as usual. Workflow C debriefs every flight.
# Per load case: trim hover (integrator offset, motor headroom), lawnmower (rows 0.25 m apart, rounded corners),
# zig-zag (waypoints 0.2 m apart in x, rounded). Waypoints are metres in the ground-centre frame, inside
# x +-1.0 / y +-1.0 (cage limits x +-1.3, y +-1.7). Pass criteria are in the lab doc, PROPOSED.
campaign: payload_waypoints
objective: "PID baseline under no / symmetric / asymmetric payload: hover trim, lawnmower and zig-zag waypoint tracking"
controller: pid
mode: fly
packs:
  - P4000-1          # launch Q2 replaces this with the packs on hand
  - P4000-2
max_flights: 9
experiments:
  # ---- load case 1: no load ----
  - name: noload_hover
    scenario: &hover
      scenario: payload-hover
      description: take off to 0.8 m, hold 20 s (trim and motor headroom), land
      steps:
        - takeoff: {z: 0.8}
        - hold: {s: 20}
        - land
    capture: campaign
    repeats: 1
    log_plan: &log {rate_hz: 50, groups: [velocity_loops]}
  - name: noload_lawnmower
    scenario: &lawnmower
      scenario: payload-lawnmower
      description: 9 rows x 1.6 m, 0.25 m apart, corners rounded once, 0.3 m/s at 0.8 m
      steps:
        - takeoff: {z: 0.8}
        - hold: {s: 3}
        - path:
            shape: waypoints
            params:
              corner_cut: 1
              points_m: [[-0.8, -1.0], [0.8, -1.0], [0.8, -0.75], [-0.8, -0.75], [-0.8, -0.5], [0.8, -0.5],
                         [0.8, -0.25], [-0.8, -0.25], [-0.8, 0.0], [0.8, 0.0], [0.8, 0.25], [-0.8, 0.25],
                         [-0.8, 0.5], [0.8, 0.5], [0.8, 0.75], [-0.8, 0.75], [-0.8, 1.0], [0.8, 1.0]]
            v_cruise_mps: 0.3
            a_max_mps2: 0.5
            ds_m: 0.05
        - hold: {s: 3}
        - land
    capture: campaign
    repeats: 1
    log_plan: *log
  - name: noload_zigzag
    scenario: &zigzag
      scenario: payload-zigzag
      description: 11 waypoints 0.2 m apart in x, alternating y +-0.6, corners rounded twice, 0.2 m/s at 0.8 m
      steps:
        - takeoff: {z: 0.8}
        - hold: {s: 3}
        - path:
            shape: waypoints
            params:
              corner_cut: 2
              points_m: [[-1.0, -0.6], [-0.8, 0.6], [-0.6, -0.6], [-0.4, 0.6], [-0.2, -0.6], [0.0, 0.6],
                         [0.2, -0.6], [0.4, 0.6], [0.6, -0.6], [0.8, 0.6], [1.0, -0.6]]
            v_cruise_mps: 0.2
            a_max_mps2: 0.5
            ds_m: 0.05
        - hold: {s: 3}
        - land
    capture: campaign
    repeats: 1
    log_plan: *log
  # ---- load case 2: symmetric payload (operator mounts it centred before this go) ----
  - {name: sym_hover, scenario: *hover, capture: campaign, repeats: 1, log_plan: *log}
  - {name: sym_lawnmower, scenario: *lawnmower, capture: campaign, repeats: 1, log_plan: *log}
  - {name: sym_zigzag, scenario: *zigzag, capture: campaign, repeats: 1, log_plan: *log}
  # ---- load case 3: asymmetric payload (operator moves it off-centre before this go) ----
  - {name: asym_hover, scenario: *hover, capture: campaign, repeats: 1, log_plan: *log}
  - {name: asym_lawnmower, scenario: *lawnmower, capture: campaign, repeats: 1, log_plan: *log}
  - {name: asym_zigzag, scenario: *zigzag, capture: campaign, repeats: 1, log_plan: *log}
abort: {}
