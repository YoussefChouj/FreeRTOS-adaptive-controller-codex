# Workflow-C flight series D-H (2026-10-07), flown by hand after step C, one campaign per flight:
#   python -m ground_station.service.campaign_fly <launch copy> --pack <id> --run <run folder>
# Camera sees only about +0.4-0.5 m of +y from the pad, so every shape stays at y <= +0.35 (most at y <= 0).
# Every trajectory starts and ends at the pad hover (firmware). Airborne cap 120 s (API/wfb_safety.c); each upload
# cost about 5.3 s of hover in step B. Timings in the comments are schedule estimates; projections are PROPOSED.
# H rate-loop system ID: multisine 0.5-15 Hz, 30 deg/s (sysid_loads uses 40) on roll, then pitch, 15 s each, 100 Hz
# log with fewer groups. Reads: roll/pitch rate frequency response for the plant model (PID/MRAC design).
# The most aggressive flight of the series: fly it last, and only if D-G looked clean.
campaign: wfc-sysid-h
objective: "rate-loop multisine 0.5-15 Hz, 30 deg/s, roll then pitch 15 s each, hover 0.8 m over the pad"
controller: pid
mode: fly
packs:
  - P4000-1
max_flights: 1
experiments:
  - name: f01_sysid
    scenario:
      scenario: sysid-h
      description: "rate-loop multisine 0.5-15 Hz, 30 deg/s, roll then pitch 15 s each, hover 0.8 m over the pad"
      motion: {v_cruise_mps: 0.3, a_max_mps2: 0.5, ds_m: 0.05}
      steps:
        - takeoff: {z: 0.8}
        - hold: {s: 3}
        - hold: {s: 5}
        - excite: {axis: roll, signal: multisine, f0: 0.5, f1: 15, amp: 30, duration_s: 15}
        - hold: {s: 5}
        - excite: {axis: pitch, signal: multisine, f0: 0.5, f1: 15, amp: 30, duration_s: 15}
        - hold: {s: 3}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [estimator_truth, thrust_model]}
abort: {}
