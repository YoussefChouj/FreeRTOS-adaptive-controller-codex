# WP-27 battery 3 (docs/workflow-b/mrac-variants.md): MRAC V2 saturation-aware leakage on top of V1, injected.
# Start: apply_params(presets.v2_sataware) from controllers/mrac_v2.yaml on the ground; end: presets.restore.
# The last flight repeats the hover with a 100 g offset payload: the operator mounts it before that go.
# Pass: motor clamp time <= pid_ref, figure-8 RMSE <= 1.1 x pid_ref. PROPOSED.
campaign: v2_sataware
objective: "MRAC V2 (mu_sat leakage on |u_def|) injected: hover, doublet, figure-8, hover with offset payload"
controller: mrac_v2
mode: fly
packs:
  - P4000-1
max_flights: 4
experiments:
  - name: hover
    scenario:
      scenario: mrac-hover
      description: takeoff 0.8, hold 40 s, land
      steps:
        - takeoff: {z: 0.8, mrac_injection: 1}
        - hold: {s: 40}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
  - name: doublet
    scenario:
      scenario: mrac-doublet
      description: goto x +0.4 / -0.4 then y +0.4 / -0.4, dwell 3 s, back to the hover point each time
      steps:
        - takeoff: {z: 0.8, mrac_injection: 1}
        - hold: {s: 3}
        - goto: {x: 0.4, y: 0.0, z: 0.8, dwell_s: 3.0}
        - goto: {x: -0.4, y: 0.0, z: 0.8, dwell_s: 3.0}
        - goto: {x: 0.0, y: 0.4, z: 0.8, dwell_s: 3.0}
        - goto: {x: 0.0, y: -0.4, z: 0.8, dwell_s: 3.0}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
  - name: figure8
    scenario:
      scenario: mrac-figure8
      description: figure-8 width 1.0 height 0.5 at 0.3 m/s, 2 laps
      steps:
        - takeoff: {z: 0.8, mrac_injection: 1}
        - hold: {s: 3}
        - path: {shape: figure8, params: {width_m: 1.0, height_m: 0.5}, v_cruise_mps: 0.3}
        - path: {shape: figure8, params: {width_m: 1.0, height_m: 0.5}, v_cruise_mps: 0.3}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
  - name: hover_offset_payload
    scenario:
      scenario: mrac-hover
      description: same hover with a 100 g payload mounted off-centre (operator, before the go)
      steps:
        - takeoff: {z: 0.8, mrac_injection: 1}
        - hold: {s: 40}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
abort: {tilt_deg: 12, pos_err_m: 0.5, sat_window_s: 0.5}
