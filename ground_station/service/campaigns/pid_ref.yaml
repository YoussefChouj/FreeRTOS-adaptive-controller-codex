# WP-27 battery 1 (docs/workflow-b/mrac-variants.md): baseline. PID flies; MRAC V1 runs in shadow (injection 0).
# Start: apply_params(presets.pid_ref) from controllers/mrac_v1.yaml on the ground (CMD 0x1D is refused airborne);
# end: apply_params(presets.restore). Both come from ground_station.analysis.mrac_variants.campaign_presets(<this file>).
# Flights: H hover 40 s, D x/y doublet +-0.4 m, F figure-8 1.0 x 0.5 m at 0.3 m/s, 2 laps. All at z 0.8, inside the
# soft fence z <= 1.4, |x| <= 1.3, |y| <= 1.7 (trajectory_pipeline.TrajLimits checks every point). PROPOSED.
campaign: pid_ref
objective: "baseline: PID flight with MRAC V1 in shadow; V1 band rate error vs the flown passthrough type"
controller: mrac_v1
mode: fly
packs:
  - P4000-1
max_flights: 3
experiments:
  - name: hover
    scenario:
      scenario: mrac-hover
      description: takeoff 0.8, hold 40 s, land
      steps:
        - takeoff: {z: 0.8, mrac_injection: 0}
        - hold: {s: 40}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
  - name: doublet
    scenario:
      scenario: mrac-doublet
      description: goto x +0.4 / -0.4 then y +0.4 / -0.4, dwell 3 s, back to the hover point each time
      steps:
        - takeoff: {z: 0.8, mrac_injection: 0}
        - hold: {s: 3}
        - goto: {x: 0.4, y: 0.0, z: 0.8, dwell_s: 3.0}
        - goto: {x: -0.4, y: 0.0, z: 0.8, dwell_s: 3.0}
        - goto: {x: 0.0, y: 0.4, z: 0.8, dwell_s: 3.0}
        - goto: {x: 0.0, y: -0.4, z: 0.8, dwell_s: 3.0}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
  - name: figure8
    scenario:
      scenario: mrac-figure8
      description: figure-8 width 1.0 height 0.5 at 0.3 m/s, 2 laps
      steps:
        - takeoff: {z: 0.8, mrac_injection: 0}
        - hold: {s: 3}
        - path: {shape: figure8, params: {width_m: 1.0, height_m: 0.5}, v_cruise_mps: 0.3}
        - path: {shape: figure8, params: {width_m: 1.0, height_m: 0.5}, v_cruise_mps: 0.3}
        - land
    capture: campaign
    repeats: 1
    log_plan: {rate_hz: 100, groups: [mrac_shadow]}
abort: {tilt_deg: 12, pos_err_m: 0.5, sat_window_s: 0.5}
